 * ---------------------------------------------------------------------------
 * GRAILS 7 MIGRATION SPIKE (ft/grails7-migration-spike)
 *
 * Rewritten for Grails 7.2.4 (Apache Grails, org.apache.grails coordinates,
 * Spring Boot 3.5 / Spring 6 / Groovy 4 / Hibernate 5.6 jakarta / Java 17,
 * Gradle 8.14.5). Versions of framework-adjacent libraries come from the
 * grails-bom platform; only libraries outside the BOM are pinned here or in
 * gradle.properties. The Grails-2/3-era resolutionStrategy blocks were removed
 * on purpose: they would fight the BOM.
 *
 * Plugins dropped because they have no Grails 7 release (replacements in-tree):
 *   csv, excel-import             -> vendored sources (src/main/groovy, services)
 *   rendering                     -> io.github.gpc:rendering:7.0.3 (community Grails 7 port)
 *   browser-detection             -> org.pih.warehouse.core.UserAgentIdentService
 *   grails-pretty-time            -> PrettyTimeTagLib + ocpsoft prettytime lib
 *   external-config               -> Grails 7 core loads grails.config.locations
 *   gpars + async usage           -> GparsService on java.util.concurrent
 *   quartz-monitor, console, views-json, joda-time plugin, code-coverage,
 *   ajax-tags (GSP tags pending), grails-test-mixins -> dropped
 * ---------------------------------------------------------------------------
 */

import java.time.LocalDateTime
import java.time.format.DateTimeFormatter

buildscript {
    repositories {
        mavenCentral()
        maven { url = 'https://repo.grails.org/grails/restricted' }
    }
    dependencies {
        classpath platform("org.apache.grails:grails-bom:$grailsVersion")
        classpath 'org.apache.grails:grails-gradle-plugins'
        classpath 'org.apache.grails:grails-data-hibernate5'
        classpath 'cloud.wondrify:asset-pipeline-gradle'
    }
}

plugins {
    id 'war'
    id 'idea'
    id 'eclipse'
    id 'jacoco'

    // Generates "git.properties" for the actuator info endpoint and Sentry releases
    id 'com.gorylenko.gradle-git-properties' version '2.4.2'

    // enable `npmInstall` and `npm_run_*` targets, and the `node` block below
    id 'com.github.node-gradle.node' version '7.1.0'
}

apply plugin: 'org.apache.grails.gradle.grails-web'
apply plugin: 'cloud.wondrify.asset-pipeline'
apply plugin: 'org.apache.grails.gradle.grails-gsp'

group = 'com.openboxes'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

/*
 * Because we use webpack to bundle .css and .js files, most of
 * asset-pipeline's advanced features are unnecessary.
 */
assets {
    developmentRuntime = false
    enableDigests = false
    enableGzip = false
    enableSourceMaps = false
    maxThreads = 1
    minifyJs = false
    minifyCss = false
    skipNonDigests = false
}

bootRun {
    jvmArgs = [
        '-Dspring.output.ansi.enabled=never',
        '-Xms1g',
        '-Xmx4g',
    ]
    systemProperties System.properties

    // if using a Gradle daemon, don't use its working directory
    systemProperty 'user.dir', project.projectDir.absolutePath
}

configurations {
    configureEach {
        // use com.github.librepdf:openpdf instead
        exclude group: 'com.lowagie', module: 'itext'
    }
}

configurations.matching { it.name == 'integrationTestImplementation' }.configureEach {
    it.extendsFrom(configurations.implementation)
}

node {
    distBaseUrl = 'https://nodejs.org/dist'
    download = true
    npmVersion = '6.14.18'
    version = '14.21.3'
}

processResources {
    dependsOn 'npm_run_bundle'
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.grails.org/grails/restricted' }
    maven { url = 'https://jitpack.io' }
}

/*
 * Add migrations to `sourceSets` *before* introducing liquibase dependencies.
 */
sourceSets {
    main {
        resources {
            srcDirs 'grails-app/migrations', 'src/integration-test/resources/migrations'
        }
    }
    test {
        groovy {
            // Grails-2-era relics misplaced in the unit tree (note the 'warhouse' typo
            // in their package); migrate to real integration specs or delete separately.
            exclude 'integration-test/**'
        }
    }
}

springBoot {
    buildInfo()
    mainClass = 'org.pih.warehouse.Application'
}

war {
    archiveFileName = 'openboxes.war'
    zip64 = true
}

dependencies {
    implementation platform("org.apache.grails:grails-bom:$grailsVersion")
    profile 'org.apache.grails.profiles:web'

    // --- Grails framework modules (Grails 3 grails-plugin-* equivalents) ---
    implementation 'org.apache.grails:grails-core'
    implementation 'org.apache.grails:grails-codecs'           // grails-app/utils *Codec classes
    implementation 'org.apache.grails:grails-converters'       // grails.converters.JSON / XML
    implementation 'org.apache.grails:grails-data-hibernate5'  // GORM (Hibernate 5.6 jakarta)
    implementation 'org.apache.grails:grails-databinding'
    implementation 'org.apache.grails:grails-events'
    implementation 'org.apache.grails:grails-gsp'
    implementation 'org.apache.grails:grails-interceptors'
    implementation 'org.apache.grails:grails-layout'
    implementation 'org.apache.grails:grails-logging'
    implementation 'org.apache.grails:grails-rest-transforms'
    implementation 'org.apache.grails:grails-scaffolding'      // `static scaffold` admin CRUD
    implementation 'org.apache.grails:grails-services'
    implementation 'org.apache.grails:grails-url-mappings'
    implementation 'org.apache.grails:grails-web-boot'
    implementation 'org.apache.grails:grails-async'
    console 'org.apache.grails:grails-console'

    // --- Surviving Grails plugins, now framework-aligned under org.apache.grails ---
    implementation 'org.apache.grails:grails-quartz'                       // 13 jobs keep working
    implementation 'org.apache.grails:grails-cache'                        // grails.plugin.cache.Cacheable
    implementation 'org.apache.grails:grails-data-hibernate5-dbmigration'  // was database-migration; Liquibase 4.27
    implementation 'io.github.gpc:rendering:7.0.3'  // Grails Plugin Collective port of the rendering plugin (PdfRenderingService)

    // --- Spring Boot ---
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-logging'
    implementation 'org.springframework.boot:spring-boot-starter-tomcat'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework:spring-orm'
    // carried over from Grails 3 (OBS-372): GrailsWebMockUtil mock requests need spring-test at runtime
    runtimeOnly 'org.springframework:spring-test'

    runtimeOnly 'com.zaxxer:HikariCP'  // replaces tomcat-jdbc; Grails 7 default pool
    runtimeOnly 'cloud.wondrify:asset-pipeline-grails'
    runtimeOnly 'org.fusesource.jansi:jansi'

    // --- Database drivers ---
    runtimeOnly "mysql:mysql-connector-java:${mySqlConnectorVersion}"
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

    // --- Jakarta mail (MailService/PersonService/NotificationService) ---
    implementation 'jakarta.mail:jakarta.mail-api:2.1.3'
    implementation 'org.apache.commons:commons-email2-jakarta:2.0.0-M1'
    runtimeOnly 'org.eclipse.angus:angus-mail:2.0.3'

    // jakarta.xml.bind.ValidationException used as an app-level exception in 3 files
    implementation 'jakarta.xml.bind:jakarta.xml.bind-api'
    // javax-JAXB island for docx4j 8/xdocreport (DocumentService/FileService)
    implementation 'javax.xml.bind:jaxb-api:2.3.1'
    runtimeOnly 'com.sun.xml.bind:jaxb-impl:2.3.9'

    // Jackson is used directly by the http/dto layer (BOM-managed versions)
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // BootStrap/LiquibaseUtil drive Liquibase directly (BOM-managed 4.27)
    implementation 'org.liquibase:liquibase-core'

    // --- Sentry (jakarta variants; custom tracing classes import io.sentry.spring.jakarta) ---
    implementation "io.sentry:sentry-logback:${sentryVersion}"
    implementation "io.sentry:sentry-servlet-jakarta:${sentryVersion}"
    implementation "io.sentry:sentry-jdbc:${sentryVersion}"
    implementation "io.sentry:sentry-spring-jakarta:${sentryVersion}"

    // --- PDF / documents ---
    implementation "com.github.librepdf:openpdf:${openPdfVersion}"
    implementation "org.xhtmlrenderer:flying-saucer-core:${flyingSaucerVersion}"
    implementation "org.xhtmlrenderer:flying-saucer-pdf-openpdf:${flyingSaucerVersion}"
    /*
     * docx->pdf conversion is a javax-JAXB island: xdocreport has no jakarta build
     * and pairs with docx4j 8.x, which runs (but is legacy) on Java 17.
     * Future options: replace xdocreport, or move to docx4j 11 once xdocreport does.
     */
    implementation "fr.opensagres.xdocreport:fr.opensagres.xdocreport.converter.docx.docx4j:${xDocReportVersion}"
    implementation "fr.opensagres.xdocreport:fr.opensagres.xdocreport.document:${xDocReportVersion}"
    implementation "fr.opensagres.xdocreport:fr.opensagres.xdocreport.template:${xDocReportVersion}"
    implementation "fr.opensagres.xdocreport:fr.opensagres.xdocreport.converter:${xDocReportVersion}"
    implementation("fr.opensagres.xdocreport:fr.opensagres.xdocreport.converter.docx.xwpf:${xDocReportVersion}") {
        exclude group: 'org.apache.poi', module: 'poi-ooxml'
    }
    implementation "fr.opensagres.xdocreport:fr.opensagres.xdocreport.converter.odt.odfdom:${xDocReportVersion}"
    implementation "fr.opensagres.xdocreport:fr.opensagres.xdocreport.document.docx:${xDocReportVersion}"
    implementation "fr.opensagres.xdocreport:fr.opensagres.xdocreport.document.odt:${xDocReportVersion}"
    implementation "fr.opensagres.xdocreport:fr.opensagres.xdocreport.template.freemarker:${xDocReportVersion}"
    implementation "fr.opensagres.xdocreport:fr.opensagres.xdocreport.template.velocity:${xDocReportVersion}"
    implementation "org.docx4j:docx4j-JAXB-ReferenceImpl:${docx4jVersion}"

    // --- Spreadsheets / CSV / barcodes ---
    implementation "org.apache.poi:poi:${poiVersion}"
    implementation 'org.jxls:jxls:2.12.0'
    implementation('org.jxls:jxls-poi:1.0.14') {
        exclude group: 'org.jxls', module: 'jxls'
    }
    implementation 'net.sf.opencsv:opencsv:2.3'  // au.com.bytecode packages for vendored csv classes
    implementation 'org.apache.commons:commons-csv:1.10.0'
    implementation 'com.google.zxing:javase:3.5.1'
    implementation 'fr.w3blog:zebra-zpl:0.0.4'
    implementation 'com.github.albfernandez:juniversalchardet:2.4.0'

    // --- Commons & misc (carried over) ---
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.google.guava:guava:32.0.1-jre'
    implementation 'com.newrelic.agent.java:newrelic-api:8.2.0'
    implementation 'commons-beanutils:commons-beanutils:1.9.4'
    implementation 'commons-codec:commons-codec:1.15'
    implementation 'org.apache.commons:commons-collections4:4.4'
    implementation 'commons-collections:commons-collections:3.2.2'
    implementation 'commons-lang:commons-lang:2.6'
    implementation 'org.apache.commons:commons-text:1.15.0'
    implementation 'commons-validator:commons-validator:1.7'  // EmailValidator (was transitive via excel-import)
    implementation 'org.apache.httpcomponents:httpclient:4.5.14'
    implementation 'org.apache.httpcomponents:fluent-hc:4.5.14'
    implementation 'joda-time:joda-time:2.12.5'  // vendored excel-import + a few services
    implementation 'org.ocpsoft.prettytime:prettytime:4.0.6.Final'  // was transitive via grails-pretty-time
    implementation 'org.apache.groovy:groovy-sql'  // Groovy 4 coordinates (was org.codehaus.groovy)

    // --- Tests (NOT the target of this spike; expect further work) ---
    testImplementation 'org.apache.grails:grails-testing-support-datamapping'
    testImplementation 'org.apache.grails:grails-testing-support-web'
    testImplementation 'org.spockframework:spock-core'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.icegreen:greenmail:2.0.1'
    testImplementation 'org.json:json:20240303'  // was transitive on Grails 3; ProductApiControllerSpec uses it
    testImplementation 'org.apache.commons:commons-compress:1.21'
    testImplementation "org.testcontainers:mysql:${testContainersVersion}"
    testImplementation "org.testcontainers:mariadb:${testContainersVersion}"
    testImplementation "org.testcontainers:spock:${testContainersVersion}"
    testImplementation 'org.springframework:spring-test'
    testImplementation('io.rest-assured:rest-assured:3.2.0') {
        // pulls codehaus groovy 2.4, which capability-conflicts with Groovy 4;
        // bump to rest-assured 5.x when the integration tests are migrated
        exclude group: 'org.codehaus.groovy'
    }
    integrationTestImplementation testFixtures('org.apache.grails:grails-geb')
    // community fork of build-test-data with a Grails 7 line (package grails.buildtestdata unchanged)
    integrationTestImplementation 'io.github.longwa:build-test-data:6.0.0-M2'
}

tasks.withType(GroovyCompile).configureEach {
    // The Groovy compiler runs in a separate Gradle worker process, which defaults to -Xmx512m; a full compile peaks at ~1.5 GB
    groovyOptions.forkOptions.memoryMaximumSize = '2g'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()

    // never consider test tasks as up-to-date - always run them when requested
    outputs.upToDateWhen { false }

    systemProperty 'api.version', dockerApiVersion
    systemProperty 'geb.build.reportsDir', reporting.file('geb/integrationTest')
    systemProperty 'geb.env', System.getProperty('geb.env')
    systemProperty 'webdriver.chrome.driver', System.getProperty('webdriver.chrome.driver')
    systemProperty 'webdriver.firefox.driver', System.getProperty('webdriver.firefox.driver')
    systemProperty 'username', System.getProperty('username')
    systemProperty 'password', System.getProperty('password')

    testLogging {
        events 'failed', 'passed', 'skipped'
        exceptionFormat 'full'
        showStackTraces = true
        showStandardStreams = true
    }
}

/*
 * Create a grails.build.info file after every successful build, whose
 * contents can be retrieved via <g:meta name='property.name' /> or
 * grailsApplication.metadata.getProperty('property.name').
 */
tasks.matching { it.name == 'buildProperties' }.configureEach {
    doLast {
        File grailsBuildInfoFile = it.outputs.files.files.find {
            it.name == 'grails.build.info'
        }
        if (grailsBuildInfoFile == null) {
            return
        }

        Map<String, String> env = System.getenv()
        Properties properties = new Properties()

        if (grailsBuildInfoFile.canRead()) {
            grailsBuildInfoFile.withInputStream {
                properties.load(it)
            }
        }

        properties.with {
            setProperty('build.host', InetAddress.localHost.hostName)
            setProperty('build.java.version', System.getProperty('java.version'))
            setProperty('build.tag', env.BUILD_TAG ?: 'N/A')
            setProperty('build.time', LocalDateTime.now().format(DateTimeFormatter.ISO_DATE_TIME))
            setProperty('build.username', System.properties['user.name'])

            if (env.bamboo_planRepository_branch) {
                setProperty('build.git.branch.default', env.bamboo_planRepository_branch)
            }
            if (env.bamboo_customRevision) {
                setProperty('build.git.revision.custom', env.bamboo_customRevision)
            }
            if (env.bamboo_repository_revision_number) {
                setProperty('build.git.sha', env.bamboo_repository_revision_number)
            }
        }

        grailsBuildInfoFile.withOutputStream {
            properties.store(it, null)
        }
    }
}

task cleanWebpack(type: Delete) {
    description = "Delete webpack's file cache and output directory"
    group = 'Build'
    delete file('node_modules/.cache')
    delete file('src/main/webapp/webpack')
}

clean.dependsOn cleanWebpack

task prepareDocker(type: Copy, dependsOn: assemble) {
    description = 'Copy files from ./docker and openboxes.war to build directory'
    group = 'Docker'

    from 'build/libs/openboxes.war'
    from 'docker/Dockerfile'

    into layout.buildDirectory.dir('docker')
}

// Jacoco code coverage reporting: "./gradlew jacocoTestReport"
jacocoTestReport {
    dependsOn test

    reports {
        xml.required = true
        html.required = true
    }

    doFirst {
        classDirectories.setFrom(files(files('build/classes/groovy/main').collect {
            fileTree(dir: it)
        }))
    }
}
