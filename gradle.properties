grailsVersion=7.2.4
version=0.9.10-SNAPSHOT

org.gradle.caching=true
org.gradle.console=plain
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.warning.mode=all
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -Xmx3g

#
# Library versions NOT managed by the Grails BOM (the BOM now owns Spring Boot,
# Spring, Groovy, Hibernate 5.6.15, Liquibase 4.27, Spock, asset-pipeline, etc.)
#
sentryVersion=6.34.0
# POI 3.17 kept because the vendored excel-import classes use the POI 3.x API
poiVersion=3.17
openPdfVersion=1.3.11
flyingSaucerVersion=9.1.22
# xdocreport (docx->pdf) still requires javax-JAXB docx4j 8.x; see build.gradle note
xDocReportVersion=2.0.4
docx4jVersion=8.3.8
mySqlConnectorVersion=8.0.22
testContainersVersion=1.21.3
dockerApiVersion=1.44
