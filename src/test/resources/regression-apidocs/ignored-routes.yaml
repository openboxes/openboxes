# OBAF (feature/obaf-integration) findings.

# The spec documented POST /api/locations as locationApi/create; OBAF routes it to locationApi/upsert, so create is
# reachable only through the "/api/locations/$id/$action" wildcard.
- kind: wildcard-only
  path: '/api/locations/{id}/create'
  method: '*'
  target: locationApi/create
  reason: >-
    Inherited BaseDomainApiController.create, reachable only through the "/api/locations/$id/$action" wildcard;
    on OBAF locations are created with POST /api/locations (upsert).
- {kind: wildcard-alias, path: '/api/locations/{id}/upsert', method: '*', target: locationApi/upsert, reason: *alias}
- {kind: wildcard-alias, path: '/api/products/{id}/upsert', method: '*', target: productApi/upsert, reason: *alias}

