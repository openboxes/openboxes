openapi: 3.0.3
info:
  title: OpenBoxes API
  version: develop
  description: |
    The OpenBoxes REST API. Every operation below is routed by the application; operations marked
    `x-doc-status: stub` are listed but not documented in detail yet.

    ## Authentication

    Calls are authenticated with the session of the web application (a `JSESSIONID` cookie):

    1. `POST /api/login` with a JSON body `{"username": "...", "password": "..."}`. Add
       `"location": "<location id>"` to pick the location in the same call. The response sets the
       session cookie; every later call sends it.
    2. If you did not pass a location, pick one with `PUT /api/chooseLocation/{id}`. Most operations
       work on the current location.
    3. `POST /api/logout` ends the session.

    The server can also be configured to accept HTTP Basic credentials on `/api` calls
    (`openboxes.interceptor.basicAuth.enabled`, off by default); the location then comes from the
    user's remembered location, if one is set.

    ## Errors

    For JSON requests the API answers errors in one JSON shape,
    `{"errorCode": 404, "errorMessage": "...", "errorMessages": [...]}` (`errorMessages` only when there
    are several problems, e.g. validation errors), with the matching HTTP status: 400 invalid request,
    401 not logged in, 403 not allowed for the user's role, 404 not found, 409 conflicts with existing
    data, 500 unexpected error. Some operations answer an HTML page or a redirect instead.

    ## Importing the spec

    Postman, Insomnia and code generators can import this spec. It is kept as several YAML files
    (`openapi.yaml` and the files it references); bundle them into one document first if a tool needs
    a single file.
servers:
  - url: /openboxes
security:
  - cookieAuth: []
