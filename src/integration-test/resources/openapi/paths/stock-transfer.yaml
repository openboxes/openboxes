/api/stockTransfers:
  get:
    operationId: stockTransferApi_list
    summary: List stock transfers
    description: |
      The stock transfers between bins of a location (transfer orders whose origin and destination are that location;
      returns are not listed), newest first unless sorted otherwise, paged.
    tags:
    - Stock Transfer
    x-doc-status: complete
    x-openboxes-controller: stockTransferApi
    x-openboxes-action: list
    x-openboxes-source: dynamic
    parameters:
    - name: location
      in: query
      description: Location id (required).
      schema:
        type: string
      required: true
    - name: q
      in: query
      description: Part of the number, name or description.
      schema:
        type: string
    - name: status
      in: query
      description: Only these statuses (repeat the parameter for several).
      schema:
        type: array
        items:
          type: string
          enum:
          - PENDING
          - APPROVED
          - COMPLETED
          - CANCELED
      style: form
      explode: true
    - name: lastUpdatedStartDate
      in: query
      description: Last changed on or after this day (MM/DD/YYYY, from midnight).
      schema:
        type: string
    - name: lastUpdatedEndDate
      in: query
      description: Last changed on or before this moment (MM/DD/YYYY = midnight at the start of that day).
      schema:
        type: string
    - name: orderedBy
      in: query
      description: Id of the person who ordered it.
      schema:
        type: string
    - name: createdBy
      in: query
      description: Id of the user who created it.
      schema:
        type: string
    - name: sort
      in: query
      description: Field to sort by (default dateCreated).
      schema:
        type: string
        enum:
        - orderNumber
        - name
        - status
        - dateCreated
        - lastUpdated
        - dateOrdered
        - createdBy
    - name: order
      in: query
      description: Sort direction (default desc).
      schema:
        type: string
        enum:
        - asc
        - desc
    - name: max
      in: query
      description: Page size (default 10).
      schema:
        type: integer
        minimum: 0
    - name: offset
      in: query
      description: Index of the first row (default 0).
      schema:
        type: integer
        minimum: 0
    responses:
      '200':
        description: The stock transfers.
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: array
                  items:
                    $ref: ../components/transfers.yaml#/StockTransferSummary
                totalCount:
                  type: integer
                  description: All matching rows.
              additionalProperties: true
            example:
              data:
              - id: ff808081a0f8481c01a0f84927c20054
                status: PENDING
                orderNumber: 353UZK
                name: 353UZK
                createdBy: Jane Smith
                dateCreated: '2026-10-01T16:25:39Z'
                origin: Main Warehouse
                destination: Main Warehouse
