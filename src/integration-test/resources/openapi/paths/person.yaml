/api/persons:
  get:
    operationId: personApi_list
    summary: Find people
    description: |
      People (users and contacts) matching every term in name (terms separated by spaces or commas; each term in the
      first name, last name or email; all people without terms), optionally only active ones, by last name descending
      unless sorted otherwise.
    tags:
    - Person
    x-doc-status: complete
    x-openboxes-controller: personApi
    x-openboxes-action: list
    x-openboxes-source: dynamic
    parameters:
    - name: name
      in: query
      description: Search terms.
      schema:
        type: string
    - name: status
      in: query
      description: 'true: active people only; false: inactive only.'
      schema:
        type: boolean
    - name: sort
      in: query
      description: Property to sort by (default lastName).
      schema:
        type: string
    - name: order
      in: query
      description: Sort direction (default desc).
      schema:
        type: string
        enum:
        - asc
        - desc
    - name: max
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 0
    - name: offset
      in: query
      description: Index of the first person.
      schema:
        type: integer
        minimum: 0
    responses:
      '200':
        description: The people.
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: array
                  items:
                    $ref: ../components/directory.yaml#/Person
              additionalProperties: true
            example:
              data:
              - id: '1'
                name: Jane Smith
                firstName: Jane
                lastName: Smith
                email: jane.smith@example.org
                username: jsmith
                roles:
                - ROLE_MANAGER
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      default:
        $ref: ../components/responses.yaml#/Error
  post:
