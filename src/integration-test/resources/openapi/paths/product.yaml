/api/products:
  get:
    operationId: productApi_list
    summary: List products
    description: |
      Lists products, sorted by name unless `sort`/`order` say otherwise. Without `max` every matching product comes back; pass `max` and `offset` to page. Filters combine with AND; list
      filters take several values (`categoryId=a&categoryId=b`). `q` searches name, code, description, brand,
      manufacturer, vendor and unit of measure. `format=list` answers the product list page's rows; `format=csv`
      downloads every matching product as CSV (paging ignored).
    tags:
    - Product
    x-doc-status: complete
    x-openboxes-controller: productApi
    x-openboxes-action: list
    x-openboxes-source: explicit
    parameters:
    - name: q
      in: query
      description: Text to search for.
      schema:
        type: string
    - name: categoryId
      in: query
      description: Only products in these categories.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    - name: catalogId
      in: query
      description: Only products in these catalogs.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    - name: tagId
      in: query
      description: Only products with these tags.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    - name: glAccountsId
      in: query
      description: Only products with these GL accounts.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    - name: productFamilyId
      in: query
      description: Only products in these product families.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    - name: handlingRequirementId
      in: query
      description: Only products with these handling requirements (COLD_CHAIN, CONTROLLED_SUBSTANCE, HAZARDOUS_MATERIAL, RECONDITIONED).
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    - name: includeInactive
      in: query
      description: Include inactive products (default false).
      schema:
        type: boolean
    - name: includeCategoryChildren
      in: query
      description: With categoryId, also products in the subcategories of those categories.
      schema:
        type: boolean
    - name: createdAfter
      in: query
      description: Only products created on or after this date, MM/DD/YYYY (as the product list page sends it).
      schema:
        type: string
      example: 09/01/2026
    - name: createdBefore
      in: query
      description: Only products created before this date, MM/DD/YYYY.
      schema:
        type: string
      example: 09/30/2026
    - name: format
      in: query
      description: '`list` for the product list rows, `csv` for a CSV download; JSON products when absent.'
      schema:
        type: string
        enum:
        - list
        - csv
    - name: includeAttributes
      in: query
      description: With format=csv, add a column per product attribute.
      schema:
        type: boolean
    - name: fileName
      in: query
      description: With format=csv, a prefix for the downloaded file's name.
      schema:
        type: string
    - name: max
      in: query
      description: Page size; without it, no paging.
      schema:
        type: integer
    - name: offset
      in: query
      description: Index of the first product to return.
      schema:
        type: integer
    - name: sort
      in: query
      description: Property to sort by (default name; e.g. productCode, lastUpdated).
      schema:
        type: string
    - name: order
      in: query
      description: asc (default) or desc.
      schema:
        type: string
        enum:
        - asc
        - desc
    responses:
      '200':
        description: The matching products, or the CSV file with format=csv.
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              - totalCount
              properties:
                data:
                  type: array
                  items:
                    $ref: ../components/catalog.yaml#/Product
                totalCount:
                  type: integer
                  description: All matching products (not just this page).
              additionalProperties: true
            example:
              data:
              - id: ff808081a0f3776401a0f37910ec005d
                productCode: '10001'
                name: Paracetamol 500mg tablet
                description: null
                category: Medicines
                unitOfMeasure: EA
                pricePerUnit: 0.02
                dateCreated: '2026-09-30T17:59:53Z'
                lastUpdated: '2026-09-30T17:59:53Z'
                updatedBy: Jane Smith
                color: null
                handlingIcons: []
                lotAndExpiryControl: true
                active: true
                displayNames:
                  default: null
              totalCount: 1
          text/csv:
            schema:
              type: string
            example: |
              Id,Active,ProductCode,ProductType,Name,ProductFamily,Category,GLAccount,Description,UnitOfMeasure,Tags,UnitCost,...
              ff808081a0f3776401a0f37910ec005d,true,10001,Default,Paracetamol 500mg tablet,,Medicines,,,EA,,0.0200,...
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      default:
        $ref: ../components/responses.yaml#/Error
  post:
    operationId: productApi_save
    summary: Create a product
    description: |
      Creates a product. `name`, `category` and `productType` are required; a product code is generated when none
      is given. Validation problems answer 400 with one entry per problem in `errorMessages`.
    tags:
    - Product
    x-doc-status: complete
    x-openboxes-controller: productApi
    x-openboxes-action: save
    x-openboxes-source: explicit
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/catalog.yaml#/ProductCreate
          example:
            name: Paracetamol 500mg tablet
            category:
              id: ff808081a0f3731e01a0f373c08a0000
            productType:
              id: DEFAULT
            unitOfMeasure: EA
            lotAndExpiryControl: true
    responses:
      '200':
        description: The new product.
        content:
          application/json:
            schema:
              type: object
              required:
              - product
              properties:
                product:
                  $ref: ../components/catalog.yaml#/ProductDetail
              additionalProperties: true
            example:
              product:
                id: ff808081a0f3731e01a0f37448080152
                productCode: '10001'
                name: Paracetamol 500mg tablet
                description: null
                productType:
                  id: DEFAULT
                category:
                  id: ff808081a0f3731e01a0f373c08a0000
                glAccount:
                  id: null
                productFamily:
                  id: null
                unitOfMeasure: EA
                active: true
                coldChain: false
                controlledSubstance: false
                hazardousMaterial: false
                reconditioned: false
                lotAndExpiryControl: true
                dateCreated: '2026-09-30T17:54:39.240Z'
                lastUpdated: '2026-09-30T17:54:39.240Z'
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      default:
        $ref: ../components/responses.yaml#/Error
  put:
    operationId: productApi_upsert
    summary: productApi.upsert
    tags:
    - Product
    x-doc-status: stub
    x-openboxes-controller: productApi
