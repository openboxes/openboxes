/api/products/search:
  get:
    operationId: productApi_search
    summary: Search products by name, code or identifier
    description: |
      The search behind product pickers: active products whose name, code, description, brand, manufacturer or
      supplier codes, UPC, NDC or lot numbers match the terms (split on spaces and commas). Terms shorter than three
      characters answer an empty list. `exactMatch` marks a product whose code, UPC, NDC or supplier code equals
      the whole search text.
    tags:
    - Product
    x-doc-status: complete
    x-openboxes-controller: productApi
    x-openboxes-action: search
    x-openboxes-source: explicit
    parameters:
    - name: name
      in: query
      required: true
      description: The search text (at least three characters).
      schema:
        type: string
      example: paracetamol
    - name: availableItems
      in: query
      description: When true, only products with stock at the current location, with quantity available and earliest expiry.
      schema:
        type: boolean
    responses:
      '200':
        description: The matching products.
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: array
                  items:
                    type: object
                    required:
                    - id
                    - productCode
                    - name
                    properties:
                      id:
                        type: string
                      productCode:
                        type: string
                      name:
                        type: string
                      active:
                        type: boolean
                      displayName:
                        type: string
                        nullable: true
                      color:
                        type: string
                        nullable: true
                      handlingIcons:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
                      lotAndExpiryControl:
                        type: boolean
                      exactMatch:
                        type: boolean
                      unitOfMeasure:
                        type: string
                        nullable: true
                      quantityAvailable:
                        type: number
                        description: With availableItems only.
                      minExpirationDate:
                        type: string
                        nullable: true
                        description: With availableItems only (MM/dd/yyyy).
                    additionalProperties: true
              additionalProperties: true
            example:
              data:
              - id: ff808081a0f3731e01a0f37448080152
                productCode: '10001'
                active: true
                name: Paracetamol 500mg tablet
                displayName: null
                color: null
                handlingIcons: []
                lotAndExpiryControl: true
                exactMatch: false
                unitOfMeasure: EA
      '400':
        description: No current location yet (choose one with PUT /api/chooseLocation/{id}).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              errorCode: 400
              errorMessage: Choose a location first (PUT /api/chooseLocation/{id})
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      default:
        $ref: ../components/responses.yaml#/Error
