    - name: lotNumber
      in: path
      required: true
      description: Lot number.
      schema:
        type: string
    responses:
      '200':
        description: The lot.
        content:
          application/json:
            schema:
              $ref: ../components/products.yaml#/LotOnHand
            example:
              inventoryItem:
                id: ff808081a0f905e201a0f908a1d40099
                product:
                  id: ff808081a0f905e201a0f90858e60073
                  name: Paracetamol 500mg tablets
                  productCode: '10023'
                lotNumber: LOT-2026-07
                expirationDate: 07/31/2028
              quantityOnHand: 100
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        description: The product does not exist.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              errorCode: 404
              errorMessage: Product with identifier 8a8a8a8a9b9b9b9b0000000000000001 not found
      default:
        $ref: ../components/responses.yaml#/Error
