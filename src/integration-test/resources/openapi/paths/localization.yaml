/api/localizations:
  get:
    operationId: localizationApi_list
    summary: Translated messages for the user interface
    description: |
      The messages of one language, optionally only those whose code starts with `prefix` (the React app loads
      `react.` messages this way). Without `languageCode`, the session's language.
    tags:
    - Localization
    x-doc-status: complete
    x-openboxes-controller: localizationApi
    x-openboxes-action: list
    x-openboxes-source: dynamic
    parameters:
    - name: languageCode
      in: query
      description: Locale code (e.g. fr); the session's language when absent.
      schema:
        type: string
    - name: prefix
      in: query
      description: Only messages whose code starts with this.
      schema:
        type: string
      example: react.productsList
    responses:
      '200':
        description: The messages (not wrapped in `data`).
        content:
          application/json:
            schema:
              type: object
              required:
              - messages
              - supportedLocales
              - currentLocale
              properties:
                messages:
                  type: object
                  description: Message code to translated text.
                  additionalProperties:
                    type: string
                supportedLocales:
                  type: array
                  items:
                    type: string
                currentLocale:
                  type: string
              additionalProperties: true
            example:
              messages:
                react.productsList.header.label: Products
              supportedLocales:
              - en
              - es
              - fr
              currentLocale: en
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      default:
        $ref: ../components/responses.yaml#/Error
/api/localizations/{id}:
  get:
    operationId: localizationApi_read
    summary: Translate one message
    description: One message by its code, with its arguments filled in. Unknown codes come back as the code itself.
    tags:
    - Localization
    x-doc-status: complete
    x-openboxes-controller: localizationApi
    x-openboxes-action: read
    x-openboxes-source: dynamic
    parameters:
    - name: id
      in: path
      required: true
      description: The message code.
      schema:
        type: string
      example: default.lot.label
    - name: lang
      in: query
      description: Locale code; the session's language when absent or empty.
      schema:
        type: string
    - name: args
      in: query
      description: Values for the message's placeholders, in order.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    responses:
      '200':
        description: The message (not wrapped in `data`).
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              - message
              - currentLocale
              properties:
                code:
                  type: string
                message:
                  type: string
                currentLocale:
                  type: string
              additionalProperties: true
            example:
              code: default.lot.label
              message: Lot
              currentLocale: en
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      default:
        $ref: ../components/responses.yaml#/Error
