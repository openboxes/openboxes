/api/partialReceiving/exportCsv/{id}:
  post:
    operationId: partialReceivingApi_exportCsv
    summary: Download the receiving CSV
    description: |
      The shipment's lines as CSV (one row per line, Receiving now and Comment to fill in), for
      POST /api/partialReceiving/importCsv/{id}. The body may carry unsaved page changes (as for save); nothing is saved.
    tags:
    - Partial Receiving
    x-doc-status: complete
    x-openboxes-controller: partialReceivingApi
    x-openboxes-action: exportCsv
    x-openboxes-source: explicit
    parameters:
    - name: id
      in: path
      required: true
      description: Shipment id.
      schema:
        type: string
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: ../components/receiving.yaml#/PartialReceiptInput
          example: {}
    responses:
      '200':
        description: The CSV.
        content:
          text/csv:
            schema:
              type: string
            example: |
              Receipt item id,Shipment item id,Code,Name,Lot/Serial No.,Expiration date,Bin Location,Recipient,Shipped (each),Received,To receive,Receiving now (each),Comment
              ,ff808081a0f5696801a0f56ab2bb0237,10001,Paracetamol 500mg tablet,LOT-2026-01,12/31/2027,,,10,,10,,
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      default:
        $ref: ../components/responses.yaml#/Error
/api/partialReceiving/importCsv/{id}:
  post:
    operationId: partialReceivingApi_importCsv
    summary: Import the receiving CSV
    description: |
      Sets Receiving now and Comment of the lines from the receiving CSV (multipart field importFile) and saves the
      pending receipt. Changing any other column, or naming an unknown line, is a 400.
    tags:
    - Partial Receiving
    x-doc-status: curated
    x-openboxes-controller: partialReceivingApi
    x-openboxes-action: importCsv
    x-openboxes-source: explicit
    parameters:
    - name: id
      in: path
      required: true
      description: Shipment id.
      schema:
        type: string
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
            - importFile
            properties:
              importFile:
                type: string
                format: binary
                description: The receiving CSV.
            additionalProperties: true
    responses:
      '200':
        description: Imported.
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: string
              additionalProperties: true
            example:
              data: Data was imported successfully
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      default:
        $ref: ../components/responses.yaml#/Error
/api/partialReceiving/{id}:
  get:
    operationId: partialReceivingApi_read
    summary: Read a shipment's receiving state
    description: |
      The lines of the shipment with what was shipped, received, canceled and is being received now, grouped by
      container, as the receiving page shows them. A pending receipt (saved earlier) is included.
    tags:
    - Partial Receiving
    x-doc-status: complete
    x-openboxes-controller: partialReceivingApi
    x-openboxes-action: read
    x-openboxes-source: explicit
    parameters:
    - name: id
      in: path
      required: true
      description: Shipment id.
      schema:
        type: string
    - name: stepNumber
      in: query
      description: The receiving page step (1 receive, 2 check).
      schema:
        type: string
    - name: sort
      in: query
      description: Order of the lines (the page sends its sort option).
      schema:
        type: string
    responses:
      '200':
        description: The receiving state.
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  $ref: ../components/receiving.yaml#/PartialReceipt
              additionalProperties: true
            example:
              data:
                receiptId: null
                receiptStatus: PENDING
                shipmentId: ff808081a0f5696801a0f56a9da001c7
                shipment.name: Supplier depot - Main Warehouse - 30Sep2026
                shipment.shipmentNumber: 820AAH
                shipmentStatus: SHIPPED
                origin.id: ff808081a0f5696801a0f56a9d1601bd
                origin.name: Supplier depot
                destination.id: '1'
                destination.name: Main Warehouse
                dateShipped: 09/30/2026 23:03 -04:00
                dateDelivered: 09/30/2026 23:03 -04:00
                containers:
                - container.id: null
                  container.name: null
                  shipmentItems:
                  - receiptItemId: null
                    shipmentItemId: ff808081a0f5696801a0f56a9dc801cc
                    product.id: ff808081a0f5696801a0f56a9cdd01bc
                    product.productCode: '10001'
                    product.name: Paracetamol 500mg tablet
                    lotNumber: LOT-2026-01
                    expirationDate: 12/31/2027
                    binLocation.id: null
                    binLocation.name: null
                    recipient.id: null
