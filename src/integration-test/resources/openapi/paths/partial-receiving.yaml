                    quantityReceived: 0
                    quantityCanceled: 0
                    quantityReceiving: null
                    quantityRemaining: 10
                    cancelRemaining: false
                    quantityOnHand: 10
                    comment: null
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      default:
        $ref: ../components/responses.yaml#/Error
  post:
    operationId: partialReceivingApi_update
    summary: Save receiving
    description: |
      Saves the receiving page: receiptStatus PENDING or CHECKING saves the lines as a pending receipt and answers
