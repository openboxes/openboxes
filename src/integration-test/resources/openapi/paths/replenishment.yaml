/api/replenishments:
  get:
    operationId: replenishmentApi_list
    summary: List replenishments
    description: |
      Transfer orders, unpaged and unfiltered, as plain orders (with their lines).
    tags:
    - Replenishment
    x-doc-status: curated
    x-openboxes-controller: replenishmentApi
    x-openboxes-action: list
    x-openboxes-source: dynamic
    responses:
      '200':
        description: The orders.
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
              additionalProperties: true
            example:
              data:
              - id: ff808081a0f8481c01a0f849645b01ad
                orderNumber: R-390PEX
                name: R-390PEX
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      default:
        $ref: ../components/responses.yaml#/Error
  post:
    operationId: replenishmentApi_create_post
    summary: Create a replenishment
    description: |
      Creates a pending replenishment at the current location from requirement lines (product, bin to fill and
      quantity) and picks the stock for it from the other bins. More than they hold answers 400. A create always makes a
      new one; an id in the body is ignored.
    tags:
    - Replenishment
    x-doc-status: curated
    x-openboxes-controller: replenishmentApi
    x-openboxes-action: create
    x-openboxes-source: dynamic
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/transfers.yaml#/ReplenishmentInput
          example:
            replenishmentItems:
            - product:
                id: ff808081a0f8481c01a0f84926be004c
              binLocation:
                id: ff808081a0f8481c01a0f849265c004a
              location:
