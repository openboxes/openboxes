/api/requirements:
  get:
    operationId: replenishmentApi_requirements
    summary: Bins that need replenishing
    description: |
      The bins of a location with the given status of their bin inventory level (default: below the minimum) that
      other bins of the location can give to, with what can be moved into each (the start of a replenishment). Ordered by
      zone, bin and product name.
    tags:
    - Replenishment
    x-doc-status: complete
    x-openboxes-controller: replenishmentApi
    x-openboxes-action: requirements
    x-openboxes-source: explicit
    parameters:
    - name: location.id
      in: query
      description: The location (facility) whose bins are checked.
      schema:
        type: string
      required: true
    - name: inventoryLevelStatus
      in: query
      description: |-
        Which bins, by the status of their bin inventory level: BELOW_MINIMUM
        (default), BELOW_REORDER, or BELOW_MAXIMUM (which also lists bins below their minimum or reorder
        level; see GET /api/replenishments/statusOptions). Other statuses list the bins with exactly that status.
      schema:
        type: string
        enum:
        - BELOW_MINIMUM
        - BELOW_REORDER
        - BELOW_MAXIMUM
        - IN_STOCK
        - OUT_OF_STOCK
        - NEVER_IN_STOCK
        - ABOVE_MAXIMUM
        - ALL_PRODUCTS
        default: BELOW_MINIMUM
    responses:
      '200':
        description: The bins to replenish.
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: array
                  items:
                    $ref: ../components/transfers.yaml#/Requirement
              additionalProperties: true
            example:
              data:
              - id: ff808081a0f8481c01a0f8495d98017f
                product.id: ff808081a0f8481c01a0f84926be004c
                product.productCode: '10023'
                product.name: Paracetamol 500mg tablets
                binLocation.id: ff808081a0f8481c01a0f849265c004a
                binLocation.name: P-01-03
                zone: Picking
                quantityInBin: 0
                minQuantity: 5
                maxQuantity: 10
                quantityNeeded: 10
                quantityAvailable: 20
      '400':
        description: location.id is missing, or inventoryLevelStatus is not a known status.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              errorCode: 400
              errorMessage: location.id is required
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        description: No location with that id.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              errorCode: 404
              errorMessage: Location with identifier 8a8a8a8a9b9b9b9b0000000000000001 not found
      default:
        $ref: ../components/responses.yaml#/Error
  post:
    operationId: replenishmentApi_create
    summary: Create a replenishment
    description: |
      Creates a pending replenishment at the current location from requirement lines (product, bin to fill and
      quantity) and picks the stock for it from the other bins. More than they hold answers 400. A create always makes a
      new one; an id in the body is ignored. The same as POST /api/replenishments.
