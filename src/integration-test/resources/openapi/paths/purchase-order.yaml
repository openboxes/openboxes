/api/purchaseOrders:
  get:
    operationId: purchaseOrderApi_list
    summary: List purchase orders
    description: |
      Purchase orders with their summary (derived status, lines ordered/shipped/received/invoiced, totals). format=csv
      downloads them, by order or with orderItems=true by order line.
    tags:
    - Purchase Order
    x-doc-status: complete
    x-openboxes-controller: purchaseOrderApi
    x-openboxes-action: list
    x-openboxes-source: explicit
    parameters:
    - name: searchTerm
      in: query
      description: Text in the order name, description or number.
      schema:
        type: string
    - name: status
      in: query
      description: Derived statuses to include (PENDING, PLACED, ...).
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    - name: destination
      in: query
      description: Destination location id.
      schema:
        type: string
    - name: destinationParty
      in: query
      description: Destination organization id.
      schema:
        type: string
    - name: origin
      in: query
      description: Supplier location id.
      schema:
        type: string
    - name: orderedBy
      in: query
      description: Person id.
      schema:
        type: string
    - name: createdBy
      in: query
      description: Person id.
      schema:
        type: string
    - name: paymentTerm
      in: query
      description: Payment term ids; "null" for orders without one.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          nullable: true
    - name: statusStartDate
      in: query
      description: Ordered on or after (MM/dd/yyyy).
      schema:
        type: string
    - name: statusEndDate
      in: query
      description: Ordered on or before (MM/dd/yyyy).
      schema:
        type: string
    - name: sort
      in: query
      description: Property to sort by.
      schema:
        type: string
    - name: order
      in: query
      description: asc or desc.
      schema:
        type: string
    - name: format
      in: query
      description: csv for a CSV download.
      schema:
        type: string
        enum:
        - csv
    - name: orderItems
      in: query
      description: With format=csv, one row per order line.
      schema:
        type: boolean
    - name: max
      in: query
      description: Page size.
      schema:
        type: integer
    - name: offset
      in: query
      description: Index of the first entry to return.
      schema:
        type: integer
    responses:
      '200':
        description: The purchase orders, or the CSV file with format=csv.
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: array
                  items:
                    $ref: ../components/purchasing.yaml#/PurchaseOrderSummary
                totalCount:
                  type: integer
                totalPrice:
                  type: number
                  description: Sum of the listed totals in the default currency.
              additionalProperties: true
            example:
              data:
              - status: PLACED
                id: ff808081a0f5f4f001a0f5f6c3aa00f6
                orderNumber: PO-1042
                name: Q4 medical supplies
                paymentTerm: null
                origin: Medical Supplies depot (MEDSUP)
                destination: Main Warehouse (MO)
                dateOrdered: '2026-10-01T05:36:25Z'
                orderedBy: Jane Smith
                createdBy: null
                orderItemsCount: 2
                orderedOrderItemsCount: 2
                shippedItemsCount: 0
                receivedItemsCount: 0
                invoicedItemsCount: 0
                total: 1250.00 USD
                totalNormalized: 1250.00 USD
                shipmentsCount: 0
              totalPrice: 1250.0
              totalCount: 1
          text/csv:
            schema:
              type: string
            example: |
              Status,PO Number,Name,Supplier,Destination name,Ordered by,Ordered on,Payment method,Payment terms,Line items,Ordered,Shipped,Received,Invoiced,Currency code,Total Amount (Local Currency),Total Amount (Default Currency)
              PLACED,PO-1042,Q4 medical supplies,Medical Supplies depot (MEDSUP),Main Warehouse (MO),Jane Smith,10/01/2026,,,2,2,0,0,0,USD,1250.00 USD,1250.00 USD
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      default:
        $ref: ../components/responses.yaml#/Error
