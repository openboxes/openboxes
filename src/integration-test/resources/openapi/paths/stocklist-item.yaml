/api/stocklistItems:
  get:
    operationId: stocklistItemApi_list
    summary: Stock list lines of a product
    description: |
      The lines of published stock lists that hold the product.
    tags:
    - Stocklist Item
    x-doc-status: complete
    x-openboxes-controller: stocklistItemApi
    x-openboxes-action: list
    x-openboxes-source: dynamic
    parameters:
    - name: product.id
      in: query
      description: The product.
      schema:
        type: string
      required: true
    responses:
      '200':
        description: The lines.
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: array
                  items:
                    $ref: ../components/stocklist.yaml#/StocklistItemRow
              additionalProperties: true
            example:
              data:
              - id: ff808081a0f905e201a0f90bc47602c9
                stocklistId: ff808081a0f905e201a0f90b4346024b
                name: Ward 3 weekly
                location.id: '1'
                location.name: Main Warehouse
                locationGroup.id: null
                locationGroup.name: null
                manager.id: '1'
                manager.name: Jane Smith
                manager.email: jane.smith@example.org
                uom: each
                maxQuantity: 200
                replenishmentPeriod: 7
                monthlyDemand: 858
      '400':
        description: product.id is missing.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              errorCode: 400
              errorMessage: Must provide product.id as request parameter
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      default:
        $ref: ../components/responses.yaml#/Error
  post:
    operationId: stocklistItemApi_create
    summary: Add a product to a stock list
    description: |
      Adds the product (query) to the stock list (body) with a maximum quantity.
    tags:
    - Stocklist Item
    x-doc-status: complete
    x-openboxes-controller: stocklistItemApi
    x-openboxes-action: create
    x-openboxes-source: dynamic
    parameters:
    - name: product.id
      in: query
      description: The product.
      schema:
        type: string
      required: true
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - stocklistId
            - maxQuantity
            properties:
              stocklistId:
                type: string
              maxQuantity:
                type: integer
                minimum: 0
            additionalProperties: true
          example:
            stocklistId: ff808081a0f905e201a0f90b4346024b
            maxQuantity: 200
    responses:
      '201':
        description: The new line.
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  $ref: ../components/stocklist.yaml#/StocklistItem
              additionalProperties: true
            example:
              data:
                requisitionItem.id: ff808081a0f905e201a0f90bc47602c9
                stocklistId: ff808081a0f905e201a0f90b4346024b
                name: Ward 3 weekly
                location.id: '1'
                location.name: Main Warehouse
                locationGroup.id: null
                locationGroup.name: null
                manager.id: '1'
                manager.name: Jane Smith
                manager.email: jane.smith@example.org
                uom: each
                maxQuantity: 200
                replenishmentPeriod: 7
                monthlyDemand: null
      '400':
        description: product.id or the stock list is missing or unknown.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              errorCode: 400
              errorMessage: No product found with ID -1
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      default:
        $ref: ../components/responses.yaml#/Error
