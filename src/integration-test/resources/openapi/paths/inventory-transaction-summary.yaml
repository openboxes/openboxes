# before editing an entry by hand, and the generator will leave it alone.
/api/reports/inventory-transactions-summary:
  get:
    operationId: inventoryTransactionSummaryApi_getInventoryTransactionsSummary
    summary: Inventory transactions summary
    description: |
      The stock counts and record-stock transactions at the facility in the range, each with the quantity before
      and after it. Both ends of the range are required. Appending .csv to the path downloads every row as CSV.
    tags:
    - Inventory Transaction Summary
    x-doc-status: complete
    x-openboxes-controller: inventoryTransactionSummaryApi
    x-openboxes-action: getInventoryTransactionsSummary
    x-openboxes-source: explicit
    parameters:
    - name: facility
      in: query
      description: The facility (location) id (required).
      schema:
        type: string
      required: true
    - name: products
      in: query
      description: Only these products (ids; repeat for several).
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
    - name: startDate
      in: query
      description: From this day (MM/dd/yyyy) (required).
      schema:
        type: string
      required: true
    - name: endDate
      in: query
      description: Up to the end of this day (MM/dd/yyyy) (required).
      schema:
        type: string
      required: true
    - name: max
      in: query
      description: Page size (default 10, at most 100).
      schema:
        type: integer
        minimum: 0
    - name: offset
      in: query
      description: Index of the first row (default 0).
      schema:
        type: integer
        minimum: 0
    - name: tab
      in: query
      description: Sent by the cycle count reporting page (which tab asks); not used.
      schema:
        type: string
    - name: sort
      in: query
      description: Sent by the reporting page; not used (the order is fixed).
      schema:
        type: string
    - name: order
      in: query
      description: Sent by the reporting page; not used.
      schema:
        type: string
    responses:
      '200':
        description: The transactions.
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: array
                  items:
                    $ref: ../components/reports.yaml#/InventoryTransactionsSummaryRow
                totalCount:
                  type: integer
              additionalProperties: true
            example:
              data:
              - transaction:
                  transactionNumber: NJZ-7ND-RUM
                product:
                  id: ff808081a0f905e201a0f90858e60073
                  name: Paracetamol 500mg tablets
                  productCode: '10023'
                  displayName: Paracetamol 500mg tablets
                facility:
                  id: '1'
                  name: Main Warehouse
                  locationNumber: null
                  active: true
                  locationType:
                    id: '2'
                    name: Depot
                    description: Depot
                    locationTypeCode: DEPOT
                  locationTypeCode: DEPOT
                quantityBefore: 100
                quantityAfter: 94
                quantityDifference: -6
                dateRecorded: '2026-10-01T14:22:03Z'
                recordedBy:
                  name: Jane Smith
                rootCauses: null
                comments: []
                varianceTypeCode: LESS
                transactionAction: RECORD_STOCK
              totalCount: 1
      '400':
        description: |-
          No facility or an unknown one, a missing start or end date, a date
          or product that does not parse, a reversed range, or paging
          that is not a number.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              errorCode: 400
              errorMessage: 'Validation error: Property [endDate] is required'
              errorMessages:
              - Property [endDate] is required
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      default:
        $ref: ../components/responses.yaml#/Error
    x-openboxes-format-suffix: true
