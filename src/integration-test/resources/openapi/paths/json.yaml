                    type: string
                  type:
                    type: string
                    description: The record's class name.
                  url:
                    type: string
                    description: The server page that shows the product.
                  value:
                    type: string
                    description: The product name.
                  label:
                    type: string
                    description: Code, display name and quantity available, e.g. "10001 Ibuprofen [12 EA]".
                  color:
                    type: string
                    nullable: true
                  displayName:
                    type: string
                    nullable: true
                additionalProperties: true
            example:
            - id: ff808081a0f3731e01a0f373c08a0001
              type: org.pih.warehouse.product.Product
              url: /openboxes/product/redirect/ff808081a0f3731e01a0f373c08a0001
