/api/globalSearch:
  get:
    operationId: json_globalSearch
    summary: Search products (the header search)
    description: Products whose code or name match every search term, best matches first, each with the quantity available to promise at the current location in its label. Products of a type that is not searchable are left out, and so are products of a type searchable only with stock when there is none. No terms, or any term shorter than openboxes.typeahead.minLength, gives an empty list.
    tags:
    - Search
    x-doc-status: complete
    x-openboxes-controller: api
    x-openboxes-action: globalSearch
    x-openboxes-source: explicit
    parameters:
    - name: term
      in: query
      required: false
      description: Search terms separated by spaces. Missing or blank, the answer is an empty list.
      schema:
        type: string
    responses:
      '200':
        description: The matching products (a plain array, no data wrapper).
        content:
          application/json:
            schema:
              type: array
