                        nullable: true
                      binLocation:
                        type: object
                        nullable: true
                        additionalProperties: true
                      uom:
                        type: string
                        nullable: true
                      recipient:
                        type: object
                        nullable: true
                        additionalProperties: true
                      sortOrder:
                        type: integer
                        nullable: true
                      recalled:
                        type: boolean
                        nullable: true
                    additionalProperties: true
              additionalProperties: true
            example:
