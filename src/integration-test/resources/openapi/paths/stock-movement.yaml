/api/stockMovements/{id}:
  get:
    operationId: stockMovementApi_read
    summary: Read a stock movement
    description: One stock movement with its line items. `stepNumber` asks for the item count of a workflow step (4 pick, 5 pack, 6 send); on the pick step `refreshPicklistItems` (default true) reallocates the picklist first.
    tags:
    - Stock Movement
    x-doc-status: complete
    x-openboxes-controller: stockMovementApi
    x-openboxes-action: read
    x-openboxes-source: dynamic
    parameters:
    - name: id
      in: path
      required: true
      description: Stock movement id.
      schema:
        type: string
    - name: stepNumber
      in: query
      description: Workflow step whose items totalCount counts.
      schema:
        type: integer
    - name: refreshPicklistItems
      in: query
      description: On the pick step, reallocate the picklist first (default true).
      schema:
        type: boolean
    responses:
      '200':
        description: The stock movement; totalCount is the number of items of the step asked for.
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              - totalCount
              properties:
                data:
                  $ref: ../components/stock-movement.yaml#/StockMovement
                totalCount:
                  type: integer
              additionalProperties: true
            example:
              data:
                id: ff808081a0f4c1bc01a0f4c94c8b00cb
                name: MainWarehouse-Clinic-30Sep2026-Weekly restock
                description: Weekly restock
                identifier: 267NNZ
                statusCode: CREATED
                origin:
                  id: '1'
                  name: Main Warehouse
                destination:
                  id: ff80808190
                  name: Clinic
                requestedBy:
                  id: '1'
                  name: Jane Smith
                dateRequested: 09/30/2026
                dateCreated: 09/30/2026
                currentStatus: PENDING
                lineItems: []
                lineItemCount: 0
                isShipped: false
                isReceived: false
                isPending: true
              totalCount: 0
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      default:
        $ref: ../components/responses.yaml#/Error
  delete:
    operationId: stockMovementApi_delete
    summary: Delete a stock movement
    description: Deletes a stock movement that has not shipped. 403 when it belongs to another location, 409 when its shipment has a status that does not allow it.
    tags:
    - Stock Movement
    x-doc-status: complete
    x-openboxes-controller: stockMovementApi
    x-openboxes-action: delete
    x-openboxes-source: dynamic
    parameters:
    - name: id
      in: path
      required: true
      description: Stock movement id.
      schema:
        type: string
    responses:
      '204':
        description: Deleted.
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/Conflict
      default:
        $ref: ../components/responses.yaml#/Error
