# Generated by the apiDocsGenerate task from the route inventory.
# Entries with x-doc-status: stub are regenerated; change x-doc-status to curated (or complete)
# before editing an entry by hand, and the generator will leave it alone.
/api/stockMovements:
  get:
    operationId: stockMovementApi_list
    summary: List stock movements
    description: Stock movements between an origin and a destination, in one direction (INBOUND to or OUTBOUND from the location the list is for). `direction` is required and origin and destination must differ, else 400. Filters combine with AND; `q` searches identifier, name and description. `format=csv` downloads the list.
    tags:
    - Stock Movement
    x-doc-status: complete
    x-openboxes-controller: stockMovementApi
    x-openboxes-action: list
    x-openboxes-source: explicit
    parameters:
    - name: direction
      in: query
      required: true
      description: INBOUND or OUTBOUND.
      schema:
        type: string
        enum:
        - INBOUND
        - OUTBOUND
    - name: origin
      in: query
      description: Origin location id.
      schema:
        type: string
    - name: destination
      in: query
      description: Destination location id.
      schema:
        type: string
    - name: q
      in: query
      description: Text in the identifier, name or description.
      schema:
        type: string
    - name: requestedBy
      in: query
      description: Person id of the requester.
      schema:
        type: string
    - name: createdBy
      in: query
      description: User id of the creator.
      schema:
        type: string
    - name: updatedBy
      in: query
      description: User id of the last editor.
      schema:
        type: string
    - name: requisitionStatusCode
      in: query
      description: Requisition statuses (CREATED, PICKING, ISSUED, ...).
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    - name: receiptStatusCode
      in: query
      description: Shipment statuses (PENDING, SHIPPED, RECEIVED, ...).
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    - name: requestType
      in: query
      description: Requisition type (STOCK, ADHOC, ...).
      schema:
        type: string
    - name: sourceType
      in: query
      description: Requisition source (ELECTRONIC, PAPER).
      schema:
        type: string
    - name: approver
      in: query
      description: User ids of approvers.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    - name: createdAfter
      in: query
      description: Only movements created on or after this date (MM/dd/yyyy).
      schema:
        type: string
      example: 09/01/2026
    - name: createdBefore
      in: query
      description: Only movements created at or before midnight at the start of this date (MM/dd/yyyy).
      schema:
        type: string
      example: 09/30/2026
    - name: shipmentType
      in: query
      description: Shipment type ids (the default type also matches movements without one).
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    - name: format
      in: query
      description: csv for a CSV download (no paging).
      schema:
        type: string
        enum:
        - csv
    - name: max
      in: query
      description: Page size.
      schema:
        type: integer
    - name: offset
      in: query
      description: Index of the first movement to return.
      schema:
        type: integer
    - name: sort
      in: query
      description: Property to sort by.
      schema:
        type: string
    - name: order
      in: query
      description: asc or desc.
      schema:
        type: string
        enum:
        - asc
        - desc
    responses:
      '200':
        description: The matching stock movements, or a CSV file with format=csv.
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              - totalCount
              properties:
                data:
                  type: array
                  items:
                    $ref: ../components/stock-movement.yaml#/StockMovement
                totalCount:
                  type: integer
              additionalProperties: true
            example:
              data:
              - id: ff808081a0f4c1bc01a0f4c94c8b00cb
                name: MainWarehouse-Clinic-30Sep2026-Weekly restock
                description: Weekly restock
                identifier: 267NNZ
                statusCode: CREATED
                origin:
                  id: '1'
                  name: Main Warehouse
                destination:
                  id: ff80808190
                  name: Clinic
                requestedBy:
                  id: '1'
                  name: Jane Smith
                dateRequested: 09/30/2026
                dateCreated: 09/30/2026
                currentStatus: PENDING
                lineItems: []
                lineItemCount: 0
                isShipped: false
                isReceived: false
                isPending: true
              totalCount: 1
          text/csv:
            schema:
              type: string
            example: |
              Status,Receipt Status,Identifier,Name,Origin,Destination,Stocklist,Requested by,Date Requested,Date Created,Date Shipped
              CREATED,PENDING,267NNZ,Weekly restock,Main Warehouse,Clinic,,Jane Smith,09-30-2026,09-30-2026,
      '400':
        description: direction missing, or origin and destination are the same.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              errorCode: 400
              errorMessage: Direction parameter is required. Origin and destination cannot be the same.
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      default:
        $ref: ../components/responses.yaml#/Error
