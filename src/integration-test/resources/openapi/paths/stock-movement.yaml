    x-openboxes-action: updateShipmentItems
    x-openboxes-source: explicit
    parameters:
    - name: id
      in: path
      required: true
      description: Stock movement id.
      schema:
        type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - packPageItems
            properties:
              packPageItems:
                type: array
                items:
                  type: object
                  required:
                  - shipmentItemId
                  properties:
                    shipmentItemId:
                      type: string
                    quantityShipped:
                      type: integer
                    palletName:
                      type: string
                    boxName:
                      type: string
                    recipient:
                      $ref: ../components/stock-movement.yaml#/IdOrEmpty
                    splitLineItems:
                      type: array
                      items:
                        type: object
                        additionalProperties: true
                  additionalProperties: true
            additionalProperties: true
          example:
            packPageItems:
            - shipmentItemId: ff808081a0f4c1bc01a0f4c8eb0c0040
              quantityShipped: 4
              palletName: Pallet 1
              splitLineItems:
