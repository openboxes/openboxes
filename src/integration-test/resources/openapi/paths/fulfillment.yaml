/api/fulfillments:
  post:
    operationId: fulfillmentApi_save
    summary: Create a shipped outbound from a packing list
    description: |
      Validates the packing list (as POST /api/fulfillments/validate does) and, when it is valid, creates the
      request, its picklist and shipment from the listed rows, ships it and debits the stock at the origin.
    tags:
    - Fulfillment
    x-doc-status: complete
    x-openboxes-controller: fulfillmentApi
    x-openboxes-action: save
    x-openboxes-source: explicit
    requestBody:
      $ref: ../components/request-bodies.yaml#/PackingListImport
    responses:
      '200':
        description: The outbound stock movement, shipped.
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  $ref: ../components/stock-movement.yaml#/StockMovement
              additionalProperties: true
            example:
              data:
                id: ff808081a0f5696801a0f56a63fa00f7
                name: MainWarehouse-Clinic-30Sep2026-Imported outbound
                identifier: 029FYK
                statusCode: DISPATCHED
      '400':
        $ref: ../components/responses.yaml#/PackingListSaveInvalid
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      default:
        $ref: ../components/responses.yaml#/Error
/api/fulfillments/validate:
  post:
    operationId: fulfillmentApi_validate
    summary: Validate a packing list
    description: |
      Checks the details, the sending options and every row of the packing list (product, lot, bin location,
      quantity available to pick, recipient, pack levels) without saving anything, and returns the rows as the
      import screen shows them.
    tags:
    - Fulfillment
    x-doc-status: complete
    x-openboxes-controller: fulfillmentApi
    x-openboxes-action: validate
    x-openboxes-source: explicit
    requestBody:
      $ref: ../components/request-bodies.yaml#/PackingListImport
    responses:
      '200':
        description: The packing list is valid; data holds its rows as the import screen shows them.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PackingListValidated
            example:
              errors:
                fulfillmentDetails: {}
                packingList: {}
                sendingOptions: {}
              data:
              - rowId: '2'
                product:
                  id: ff808081a0f5696801a0f56a5c3800c8
                  name: Paracetamol 500mg tablet
                  productCode: '10001'
                binLocation: null
                palletName: Pallet 1
                boxName: Box A
                lotNumber: LOT-2026-01
                quantityPicked: 5
                recipient: null
                expirationDate: null
                origin:
                  id: '1'
      '400':
        $ref: ../components/responses.yaml#/PackingListInvalid
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      default:
        $ref: ../components/responses.yaml#/Error
