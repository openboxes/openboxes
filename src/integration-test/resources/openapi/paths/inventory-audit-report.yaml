      description: The facility (location) id (required).
      schema:
        type: string
      required: true
    - name: products
      in: query
      description: Only these products (ids; repeat for several).
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
    - name: startDate
      in: query
      description: From this day (MM/dd/yyyy); without one, from the beginning.
      schema:
        type: string
      required: false
    - name: endDate
      in: query
      description: Up to the end of this day (MM/dd/yyyy); without one, up to now.
      schema:
        type: string
      required: false
    - name: max
      in: query
      description: Page size (default 10, at most 100).
      schema:
        type: integer
        minimum: 0
    - name: offset
      in: query
      description: Index of the first row (default 0).
      schema:
        type: integer
        minimum: 0
    - name: tab
      in: query
      description: Sent by the cycle count reporting page (which tab asks); not used.
      schema:
        type: string
    - name: sort
      in: query
      description: Sent by the reporting page; not used (the order is fixed).
      schema:
        type: string
    - name: order
      in: query
      description: Sent by the reporting page; not used.
      schema:
        type: string
    responses:
      '200':
        description: The report rows.
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: array
                  items:
                    $ref: ../components/reports.yaml#/InventoryAuditDetailsRow
                count:
                  type: integer
                max:
                  type: integer
                  nullable: true
                offset:
                  type: integer
                  nullable: true
                totalCount:
                  type: integer
              additionalProperties: true
            example:
