/api/reports/inventory-audit-details:
  get:
    operationId: inventoryAuditReport_getInventoryAuditDetails_get
    summary: Inventory audit details
    description: |
      The stock adjustments at the facility in the range, newest first: one row per adjustment of a lot and
      bin, with the quantity and value adjusted and the stock after it.
    tags:
    - Inventory Audit Report
    x-doc-status: complete
    x-openboxes-controller: inventoryAuditReport
    x-openboxes-action: getInventoryAuditDetails
