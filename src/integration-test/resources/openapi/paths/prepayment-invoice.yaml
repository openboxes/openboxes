      required: true
      description: Invoice id.
      schema:
        type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              required:
              - id
              properties:
                id:
                  type: string
                unitPrice:
                  type: number
                quantity:
                  type: integer
              additionalProperties: true
          example:
          - id: ff808081a0f5f4f001a0f5f6b05100ac
            unitPrice: 80
    responses:
