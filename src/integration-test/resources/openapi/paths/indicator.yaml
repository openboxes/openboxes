/api/reports/indicators/inventoryAccuracy:
  get:
    operationId: indicatorApi_getInventoryAccuracy
    summary: 'Inventory indicator: inventoryAccuracy'
    description: |
      The share of completed counts at the facility in the range that found no variance
      (firstValue, a percentage) and how many counts that is based on (secondValue).
    tags:
    - Indicator
    x-doc-status: complete
    x-openboxes-controller: indicatorApi
    x-openboxes-action: getInventoryAccuracy
    x-openboxes-source: explicit
    parameters:
    - name: facility
      in: query
      description: The facility (location) id.
      schema:
        type: string
      required: true
    - name: startDate
      in: query
      description: From this day (MM/dd/yyyy); without dates, all time.
      schema:
        type: string
    - name: endDate
      in: query
      description: Up to the end of this day (MM/dd/yyyy).
      schema:
        type: string
    responses:
      '200':
        description: The tile.
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  $ref: ../components/reports.yaml#/InventoryIndicator
              additionalProperties: true
            example:
              data:
                name: inventoryAccuracy
                firstValue: 95.2
                secondValue: 42
                type: DOUBLE
      '400':
        description: |-
          No facility or an unknown one, a date that does not parse, or a
          range that ends before it starts.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              errorCode: 400
              errorMessage: 'Validation error: endDate is before startDate'
              errorMessages:
              - endDate is before startDate
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      default:
        $ref: ../components/responses.yaml#/Error
