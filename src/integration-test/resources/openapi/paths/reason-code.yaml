    summary: Reason codes
    description: |
      The reason codes for an activity, in their sort order, with names in the session's language: substitutions
      (SUBSTITUTE_REQUISITION_ITEM), quantity changes (MODIFY_REQUISITION_ITEM), stock adjustments (ADJUST_INVENTORY),
      cycle counts (CYCLE_COUNT); without one of these, the default list.
    tags:
    - Reason Code
    x-doc-status: complete
    x-openboxes-controller: reasonCodeApi
    x-openboxes-action: list
    x-openboxes-source: dynamic
    parameters:
    - name: activityCode
      in: query
      description: The activity the reasons are for (the first listed above that is given wins).
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
    responses:
      '200':
        description: The reason codes.
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: array
                  items:
                    type: object
                    required:
                    - id
                    - name
                    - sortOrder
                    properties:
                      id:
                        type: string
                        description: The code (send this back).
                      name:
                        type: string
                      sortOrder:
                        type: integer
                    additionalProperties: true
              additionalProperties: true
            example:
              data:
              - id: STOCKOUT
                name: Stock-out
                sortOrder: 1
              - id: LOW_STOCK
                name: Low stock
                sortOrder: 2
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      default:
