/api/users:
  get:
    operationId: selectOptionsApi_usersOptions
    summary: Find users
    description: |
      Users whose first name, last name or email contains one of the terms in searchTerm, optionally only active ones,
      and only those with one of roleTypes (as a global role, or as a role at the location - by default the current one).
      By last name descending.
    tags:
    - Select Options
    x-doc-status: complete
    x-openboxes-controller: selectOptionsApi
    x-openboxes-action: usersOptions
    x-openboxes-source: explicit
    parameters:
    - name: searchTerm
      in: query
      description: Search terms (separated by spaces or commas).
      schema:
        type: string
    - name: active
      in: query
      description: 'true: active users only; false: inactive only.'
      schema:
        type: boolean
    - name: roleTypes
      in: query
      description: Role types, e.g. ROLE_MANAGER (repeat for several).
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
    - name: location
      in: query
      description: 'Where the location roles count (default: the current location; only with roleTypes).'
      schema:
        type: string
    responses:
      '200':
        description: The users.
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: array
                  items:
                    $ref: ../components/directory.yaml#/Person
              additionalProperties: true
            example:
              data:
              - id: '1'
                name: Jane Smith
                firstName: Jane
                lastName: Smith
                email: jane.smith@example.org
                username: jsmith
                roles:
                - ROLE_MANAGER
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      default:
        $ref: ../components/responses.yaml#/Error
