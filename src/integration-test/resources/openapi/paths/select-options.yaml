/api/catalogOptions:
  get:
    operationId: selectOptionsApi_catalogOptions
    summary: Product catalog options
    description: Every product catalog, sorted by name, labelled with its number of products unless hideNumbers is true.
    tags:
    - Select Options
    x-doc-status: complete
    x-openboxes-controller: selectOptionsApi
    x-openboxes-action: catalogOptions
    x-openboxes-source: explicit
    parameters:
    - name: hideNumbers
      in: query
      description: Leave the product counts out of the labels.
      schema:
        type: boolean
    responses:
      '200':
        description: The options.
        content:
          application/json:
            schema:
              $ref: ../components/catalog.yaml#/OptionList
            example:
              data:
              - id: ff808081a0f3731e01a0f37500120001
                label: Essential medicines (152)
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      default:
        $ref: ../components/responses.yaml#/Error
