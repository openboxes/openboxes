/api/picklists:
  get:
    operationId: picklistApi_list
    summary: List picklists
    description: |
      Picklists with their picked lines. Paged with max/offset, ordered with sort/order (any picklist property).
    tags:
    - Picklist
    x-doc-status: complete
    x-openboxes-controller: picklistApi
    x-openboxes-action: list
    x-openboxes-source: dynamic
    parameters:
    - name: max
      in: query
      description: Page size.
      schema:
        type: integer
    - name: offset
      in: query
      description: Index of the first picklist.
      schema:
        type: integer
    - name: sort
      in: query
      description: Property to sort by, e.g. dateCreated.
      schema:
        type: string
    - name: order
      in: query
      description: asc or desc.
      schema:
        type: string
        enum:
        - asc
        - desc
    responses:
      '200':
        description: The picklists.
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: array
                  items:
                    $ref: ../components/receiving.yaml#/Picklist
              additionalProperties: true
            example:
              data:
              - id: ff808081a0f5696801a0f56a3a53000f
                name: Morning pick
                description: null
                picker: null
                datePicked: null
                picklistItems:
                - id: ff808081a0f5696801a0f56a3a530010
                  status: null
                  picklist.id: ff808081a0f5696801a0f56a3a53000f
                  requisitionItem.id: ff808081a0f5696801a0f56a392d000d
                  inventoryItem.id: ff808081a0f5696801a0f56a34ce0008
                  product.name: Paracetamol 500mg tablet
                  product.displayName: null
                  product.color: null
                  productCode: '10001'
                  lotNumber: LOT-2026-01
                  expirationDate: 12/31/2027
                  binLocation.id: ff808081a0f5696801a0f56a34aa0006
                  binLocation.name: A-01-01
                  binLocation.zoneId: null
                  binLocation.zoneName: null
                  quantityPicked: 5
                  reasonCode: null
                  comment: null
                requisition.id: ff808081a0f5696801a0f56a3652000b
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      default:
        $ref: ../components/responses.yaml#/Error
  post:
    operationId: picklistApi_create
    summary: Create a picklist
    description: |
      Creates the picklist of a request; its lines are added by picking (see the stock movement picking operations).
    tags:
    - Picklist
    x-doc-status: complete
    x-openboxes-controller: picklistApi
    x-openboxes-action: create
    x-openboxes-source: dynamic
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/receiving.yaml#/PicklistInput
          example:
            requisition:
              id: ff808081a0f5696801a0f56a41590026
            name: Morning pick
    responses:
      '201':
        description: The new picklist (picklistItems is null until lines are picked).
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  $ref: ../components/receiving.yaml#/Picklist
              additionalProperties: true
            example:
              data:
                id: ff808081a0f5696801a0f56a3a53000f
                name: Morning pick
                description: null
                picker: null
                datePicked: null
                picklistItems: null
                requisition.id: ff808081a0f5696801a0f56a3652000b
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      default:
        $ref: ../components/responses.yaml#/Error
