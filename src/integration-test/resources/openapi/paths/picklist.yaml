/api/stockMovements/exportPickListItems/{id}:
  get:
    operationId: picklist_exportPicklistItems
    summary: Download the picked lines of a request
    description: |
      The request's picked lines (lot, bin, quantity picked) as CSV or Excel - the file the pick page exports.
    tags:
    - Picklist
    x-doc-status: complete
    x-openboxes-controller: picklist
    x-openboxes-action: exportPicklistItems
    x-openboxes-source: explicit
    parameters:
    - name: id
      in: path
      required: true
      description: Stock movement (request) id.
      schema:
        type: string
    - name: format
      in: query
      description: csv (default) or xls (Excel).
      schema:
        type: string
        enum:
        - csv
        - xls
    responses:
      '200':
        description: The picked lines.
        headers:
          Content-Disposition:
            description: attachment; filename=...
            schema:
              type: string
        content:
          text/csv:
            schema:
              type: string
            example: |
              Id,Code,Name,Serial / Lot Number,Expiration date,Bin Location,Quantity picked
              ff808081a0f5696801a0f56a4c480064,10001,Paracetamol 500mg tablet,LOT-2026-01,12/31/2027,A-01-01,5
          application/vnd.ms-excel:
            schema:
              type: string
              format: binary
            example: (Excel workbook)
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      default:
        $ref: ../components/responses.yaml#/Error
/api/stockMovements/importPickListItems/{id}:
  post:
    operationId: picklist_importPickListItems
    summary: Import picked lines
    description: |
      Sets the picked lines of a request from a filled-in picklist template (multipart field importFile).
    tags:
    - Picklist
    x-doc-status: curated
    x-openboxes-controller: picklist
    x-openboxes-action: importPickListItems
    x-openboxes-source: explicit
    parameters:
    - name: id
      in: path
      required: true
      description: Stock movement (request) id.
      schema:
        type: string
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
            - importFile
            properties:
              importFile:
                type: string
                format: binary
                description: The CSV or Excel file.
            additionalProperties: true
    responses:
      '200':
        description: Imported.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      default:
        $ref: ../components/responses.yaml#/Error
