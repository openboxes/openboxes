/api/productSuppliers:
  get:
    operationId: productSupplierApi_list
    summary: Product sources
    description: |
      The product sources that match the filters (active ones unless includeInactive), paged; totalCount counts
      every match.
    tags:
    - Product Supplier
    x-doc-status: complete
    x-openboxes-controller: productSupplierApi
    x-openboxes-action: list
    x-openboxes-source: dynamic
    parameters:
    - name: product
      in: query
      description: Only sources of this product (id).
      schema:
        type: string
    - name: supplier
      in: query
      description: Only sources from this supplier (id).
      schema:
        type: string
    - name: searchTerm
      in: query
      description: |-
        Part of the product code, source code or name, supplier code or name, or manufacturer code
        or name.
      schema:
        type: string
    - name: defaultPreferenceTypes
      in: query
      description: |-
        Only sources whose default preference has one of these types (ids;
        NONE for sources without one).
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
    - name: createdFrom
      in: query
      description: Created on or after this day (MM/dd/yyyy).
      schema:
        type: string
    - name: createdTo
      in: query
      description: Created on or before this moment (MM/dd/yyyy).
      schema:
        type: string
    - name: includeInactive
      in: query
      description: Include inactive sources.
      schema:
        type: boolean
        default: false
    - name: sort
      in: query
      description: Field to sort by.
      schema:
        type: string
        enum:
        - product.productCode
        - product.name
        - code
        - supplier.displayName
        - dateCreated
        - active
        - name
    - name: order
      in: query
      description: Sort direction (default asc).
      schema:
        type: string
        enum:
        - asc
        - desc
    - name: max
      in: query
      description: Page size (default 10, at most 100).
      schema:
        type: integer
        minimum: 0
    - name: offset
      in: query
      description: Index of the first row.
      schema:
        type: integer
        minimum: 0
    - name: tab
      in: query
      description: Sent by the product source list page (which tab is open); not used.
      schema:
        type: string
    responses:
      '200':
        description: The sources.
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: array
                  items:
                    $ref: ../components/products.yaml#/ProductSupplier
                totalCount:
                  type: integer
              additionalProperties: true
            example:
              data:
              - id: ff808081a0f905e201a0f9dbb1560314
                name: Paracetamol from Global Pharma
                product:
                  id: ff808081a0f905e201a0f90858e60073
                  name: Paracetamol 500mg tablets
                  productCode: '10023'
                code: 10023-GPS
                supplier:
                  id: ff808081a0f905e201a0f9dbae240310
                  name: Global Pharma Supply
                  code: GPS
                  displayName: GPS - Global Pharma Supply
                supplierCode: GPS-PCM-500
                defaultProductPackage: null
                contractPrice: null
                minOrderQuantity: null
                productSupplierPreferences: []
                packageSize: null
                packagePrice: 0.0
                unitPrice: 0.0
                dateCreated: '2026-10-01T09:45:19Z'
                lastUpdated: '2026-10-01T09:45:19Z'
                createdBy:
                  id: '1'
                  name: Jane Smith
                updatedBy:
                  id: '1'
                  name: Jane Smith
                active: true
                ratingTypeCode: GOOD
                manufacturer: null
                description: null
                manufacturerCode: null
                brandName: null
                attributes: []
                tieredPricing: false
                productCode: null
              totalCount: 1
      '400':
        description: A filter cannot be read (date, flag, paging).
        content:
          application/json:
            schema:
