/api/productsConfiguration/importCategories:
  post:
    operationId: productsConfigurationApi_importCategories
    summary: Import a configured category tree
    tags:
    - Products Configuration
    x-doc-status: curated
    x-openboxes-controller: productsConfigurationApi
    x-openboxes-action: importCategories
    x-openboxes-source: explicit
    requestBody:
      $ref: ../components/request-bodies.yaml#/StubBody
    parameters:
    - name: categoryOption
      in: query
      description: The option code, a key of the categoryOptions list.
      schema:
        type: string
    responses:
      '200':
        description: Imported (or nothing to import); no response body.
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      default:
        $ref: ../components/responses.yaml#/Error
    description: Imports the category tree of a configured option (see categoryOptions) under its root category. Without an option, or for a disabled one, nothing is imported; an unknown option answers 400.
/api/productsConfiguration/importCategoryCsv:
  post:
    operationId: productsConfigurationApi_importCategoryCsv
    summary: Import categories from an uploaded CSV
    tags:
    - Products Configuration
    x-doc-status: curated
    x-openboxes-controller: productsConfigurationApi
    x-openboxes-action: importCategoryCsv
    x-openboxes-source: explicit
    requestBody:
      $ref: ../components/request-bodies.yaml#/StubBody
    responses:
      '200':
        description: Imported; no response body.
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      default:
        $ref: ../components/responses.yaml#/Error
    description: 'Imports the categories of a CSV file (multipart field importFile, type text/csv): one row per category with its parent category name. A parent is the root (ROOT), another row of the file or an existing category; categories that exist already are left as they are. An empty file, another file type, or a row without a name or parent or naming a parent that is nowhere answers 400 and imports nothing.'
