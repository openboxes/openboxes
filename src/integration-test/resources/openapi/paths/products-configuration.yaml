/api/productsConfiguration/categoriesCount:
  get:
    operationId: productsConfigurationApi_getCategoriesCount
    summary: Number of categories
    description: |
      How many categories exist (the wizard offers a category tree only while there are none or few).
    tags:
    - Products Configuration
    x-doc-status: complete
    x-openboxes-controller: productsConfigurationApi
    x-openboxes-action: getCategoriesCount
    x-openboxes-source: explicit
    responses:
      '200':
        description: The count.
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: integer
              additionalProperties: true
            example:
              data: 206
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      default:
        $ref: ../components/responses.yaml#/Error
/api/productsConfiguration/categoryOptions:
  get:
    operationId: productsConfigurationApi_categoryOptions
    summary: Category trees to import
    description: |
      The category trees the wizard offers (configured in openboxes.configurationWizard.categoryOptions), by option
      code - the code to send to importCategories.
    tags:
    - Products Configuration
    x-doc-status: complete
    x-openboxes-controller: productsConfigurationApi
    x-openboxes-action: categoryOptions
    x-openboxes-source: explicit
    responses:
      '200':
        description: The options.
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                      title:
                        type: string
                      description:
                        type: string
                        description: HTML.
                      fileUrl:
                        type: string
                    additionalProperties: true
              additionalProperties: true
            example:
              data:
                whoCategories:
                  enabled: true
                  fileUrl: classpath:templates/configuration/WHO_categories.csv
                  rootCategoryName: ROOT
                  categoryNameColumnIndex: 0
                  parentCategoryNameColumnIndex: 1
                  title: WHO Category List
                  description: <div>A system of medical categorization used by the WHO.</div>
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      default:
        $ref: ../components/responses.yaml#/Error
/api/productsConfiguration/downloadCategories:
  get:
