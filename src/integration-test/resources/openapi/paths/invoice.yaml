/api/invoiceItems/{id}/validation:
  post:
    operationId: invoiceApi_validateInvoiceItem
    summary: Check changes to an invoice item
    description: |
      Validates the given values against an invoice item without saving anything: 200 when they are valid, 400 with
      the problems otherwise.
    tags:
    - Invoice
    x-doc-status: complete
    x-openboxes-controller: invoiceApi
    x-openboxes-action: validateInvoiceItem
    x-openboxes-source: explicit
    parameters:
    - name: id
      in: path
      required: true
      description: Invoice item id.
      schema:
        type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              quantity:
                type: integer
                nullable: true
              unitPrice:
                type: number
                nullable: true
            additionalProperties: true
          example:
            quantity: 2
    responses:
      '200':
        description: The values are valid (nothing was saved).
      '400':
        description: The values are not valid; errorMessages lists the problems.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              errorCode: 400
              errorMessage: 'Validation error: Property [quantity] is required'
              errorMessages:
              - Property [quantity] is required
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      default:
        $ref: ../components/responses.yaml#/Error
