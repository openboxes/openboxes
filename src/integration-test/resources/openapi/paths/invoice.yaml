/api/invoices/{id}/invoiceItemCandidates:
  post:
    operationId: invoiceApi_getInvoiceItemCandidates
    summary: Find what an invoice can take
    description: |
      Order lines, order adjustments and shipment lines the invoice can take: from the invoice's vendor and in its currency
      (each only when the invoice has one),
      ordered by the current location's organization, with something left to invoice. The body narrows them to some
      orders or shipments (a read; nothing changes).
    tags:
    - Invoice
    x-doc-status: complete
    x-openboxes-controller: invoiceApi
    x-openboxes-action: getInvoiceItemCandidates
    x-openboxes-source: explicit
    parameters:
    - name: id
      in: path
      required: true
      description: Invoice id.
      schema:
        type: string
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              orderNumbers:
                type: array
                items:
                  type: string
                description: Only these purchase orders.
              shipmentNumbers:
                type: array
                items:
                  type: string
                description: Only these shipments.
            additionalProperties: true
          example:
            orderNumbers:
            - PO-1042
            shipmentNumbers: []
    responses:
      '200':
        description: The candidates.
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: array
                  items:
                    $ref: ../components/purchasing.yaml#/InvoiceItemCandidate
              additionalProperties: true
            example:
              data:
              - id: ff808081a0f5f4f001a0f5f689290037
                orderNumber: PO-1042
                orderId: ff808081a0f5f4f001a0f5f689290036
                shipmentNumber: ''
                shipmentId: ''
                budgetCode: null
                glCode: null
                productCode: null
                productName: null
                supplierCode: null
                description: Freight
                quantity: 1
                quantityToInvoice: 1
