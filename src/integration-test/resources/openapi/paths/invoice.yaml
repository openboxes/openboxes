/api/invoices:
  get:
    operationId: invoiceApi_list
    summary: List invoices
    description: |
      The invoices of the current location's organization (as buyer), filtered and paged. format=csv downloads them, or
      with invoiceItems=true one row per invoice item. Answers 400 before a location is chosen.
    tags:
    - Invoice
    x-doc-status: complete
    x-openboxes-controller: invoiceApi
    x-openboxes-action: list
    x-openboxes-source: dynamic
    parameters:
    - name: invoiceNumber
      in: query
      description: Invoice number (part of it).
      schema:
        type: string
    - name: status
      in: query
      description: One invoice status (PENDING, SUBMITTED, POSTED, ...).
      schema:
        type: string
    - name: vendor
      in: query
      description: Vendor organization id.
      schema:
        type: string
    - name: invoiceTypeCode
      in: query
      description: INVOICE or PREPAYMENT_INVOICE.
      schema:
        type: string
    - name: dateInvoiced
      in: query
      description: Invoice date.
      schema:
        type: string
    - name: createdBy
      in: query
      description: Person id.
      schema:
        type: string
    - name: sort
      in: query
      description: Property to sort by.
      schema:
        type: string
    - name: order
      in: query
      description: asc or desc.
      schema:
        type: string
    - name: format
      in: query
      description: csv for a CSV download.
      schema:
        type: string
        enum:
        - csv
    - name: invoiceItems
      in: query
      description: With format=csv, one row per invoice item.
      schema:
        type: boolean
    - name: max
      in: query
      description: Page size.
      schema:
        type: integer
    - name: offset
      in: query
      description: Index of the first entry to return.
      schema:
        type: integer
    responses:
      '200':
        description: The invoices, or the CSV file with format=csv.
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: array
                  items:
                    $ref: ../components/purchasing.yaml#/InvoiceSummary
                totalCount:
                  type: integer
              additionalProperties: true
            example:
              data:
              - id: ff808081a0f5f4f001a0f5f6a1da007c
                invoiceNumber: 206ABU
                invoiceTypeCode: INVOICE
                status: PENDING
                partyCode: MEDSUP Medical Supplies Ltd
                vendorInvoiceNumber: V-2026-0412
                totalValue: 100.0
                currency: US Dollar
                itemCount: '1'
              totalCount: 1
          text/csv:
            schema:
              type: string
            example: |
              "# items",Status,Invoice Type,Invoice Number,Vendor,Vendor invoice number,Total Value,Currency
              1,PENDING,INVOICE,206ABU,MEDSUP Medical Supplies Ltd,V-2026-0412,100.0,US Dollar
      '400':
        description: No current location yet (choose one with PUT /api/chooseLocation/{id}).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              errorCode: 400
              errorMessage: Choose a location first (PUT /api/chooseLocation/{id})
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      default:
        $ref: ../components/responses.yaml#/Error
