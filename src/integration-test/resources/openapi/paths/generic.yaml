  post:
    operationId: genericApi_create
    summary: Create records of a domain resource
    description: |
      Creates one record from a JSON object, or several from a JSON array of objects, of the domain class named by
      `resource` (its simple class name, first letter lower case). Answers 201 with the created record(s) under
      `data`. A record that does not validate, a body that is not an object or an array of objects, or a record
