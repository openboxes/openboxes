/api/combinedShipmentItems/addToShipment/{id}:
  post:
    operationId: combinedShipmentItemApi_addItemsToShipment
    summary: Add order lines to a combined shipment
    description: |
      Adds lines of the vendor's placed purchase orders to the shipment, each with a quantity to ship. Every line
      must be an open line of a placed purchase order from the shipment's origin to its destination, and the
      quantity above zero and within what is left to ship; otherwise nothing is added.
    tags:
    - Combined Shipment Item
    x-doc-status: complete
    x-openboxes-controller: combinedShipmentItemApi
    x-openboxes-action: addItemsToShipment
    x-openboxes-source: explicit
    parameters:
    - name: id
      in: path
      required: true
      description: Shipment id.
      schema:
        type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - itemsToAdd
            properties:
              itemsToAdd:
                type: array
                items:
                  type: object
                  required:
                  - orderItemId
                  - quantityToShip
                  properties:
                    orderItemId:
                      type: string
                    quantityToShip:
                      type: integer
                      minimum: 1
                    sortOrder:
                      type: integer
                  additionalProperties: true
            additionalProperties: true
          example:
            itemsToAdd:
            - orderItemId: ff808081a0f905e201a0f9db263001c1
              quantityToShip: 4
              sortOrder: 0
    responses:
      '200':
        description: The shipment with its items.
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  required:
                  - id
                  - shipmentItems
                  properties:
                    id:
                      type: string
                    shipmentItems:
                      type: array
                      items:
                        type: object
                        additionalProperties: true
                  additionalProperties: true
              additionalProperties: true
            example:
              data:
                id: ff808081a0f905e201a0f9db2b9601da
                name: Combined shipment 1042
                status: PENDING
                origin:
                  id: ff808081a0f905e201a0f9db260e01bd
                  name: Global Pharma Supply
                  type: DEPOT
                destination:
                  id: '1'
                  name: Main Warehouse
                  type: DEPOT
                expectedShippingDate: 10/01/2026 19:44 -04:00
                actualShippingDate: null
                expectedDeliveryDate: null
                actualDeliveryDate: null
                shipmentItems:
                - id: ff808081a0f905e201a0f9db2bfd01db
                  inventoryItem: null
                  quantity: 4
                  recipient: null
                  container: null
                  shipment:
                    id: ff808081a0f905e201a0f9db2b9601da
                    name: Combined shipment 1042
                containers: []
      '400':
        description: |-
          A line is not an open line of a placed purchase order on the
          shipment's route, or its quantity is not above zero or more
          than is left to ship.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              errorCode: 400
              errorMessage: Order item 8a8a8a8a9b9b9b9b0000000000000001 is not an open line of a placed purchase order
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        description: The shipment does not exist.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              errorCode: 404
              errorMessage: Shipment with identifier no-such-shipment not found
      default:
        $ref: ../components/responses.yaml#/Error
/api/combinedShipmentItems/exportTemplate:
  get:
    operationId: combinedShipmentItemApi_exportTemplate
    summary: Download the combined shipment template
    description: |
      A CSV of the open lines of the vendor's placed purchase orders for the destination, each with what is left
      to ship, to fill in (lot, expiry, quantity, packs) and import with importTemplate. With blank, only the header
      and one empty row.
    tags:
    - Combined Shipment Item
    x-doc-status: complete
    x-openboxes-controller: combinedShipmentItemApi
    x-openboxes-action: exportTemplate
    x-openboxes-source: explicit
    parameters:
    - name: vendor
      in: query
      description: The vendor (supplier location) id.
      schema:
        type: string
    - name: destination
      in: query
      description: The destination (location) id.
      schema:
        type: string
    - name: blank
      in: query
      description: 'Any value: an empty template.'
      schema:
        type: string
    responses:
      '200':
        description: The template.
        content:
          text/csv:
            schema:
              type: string
            example: |
              "Order Number","Order Item ID","Product Code","Product name","Lot Number","Expiry","Quantity to Ship","UOM","Pack level 1","Pack level 2","Recipient","Budget Code","Supplier Code"
              "PO-1042","ff808081a0f905e201a0f9db263001c1","10023","Paracetamol 500mg tablets","","","10","EA/1","","","","",""
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      default:
        $ref: ../components/responses.yaml#/Error
/api/combinedShipmentItems/findOrderItems:
  post:
    operationId: combinedShipmentItemApi_findOrderItems
    summary: Open lines of a vendor's orders
    description: |
      The lines of the vendor's placed purchase orders for the destination that still have quantity left to ship
      (canceled lines left out), optionally narrowed to some of those orders and to one product. A read, sent as a
      POST.
    tags:
    - Combined Shipment Item
    x-doc-status: complete
    x-openboxes-controller: combinedShipmentItemApi
    x-openboxes-action: findOrderItems
    x-openboxes-source: explicit
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              vendor:
                type: string
                description: The vendor (supplier location) id.
              destination:
                type: string
                description: The destination id.
              orderIds:
                type: array
                items:
                  type: string
                description: Only these orders (others of the vendor are ignored).
              productId:
                type: string
                nullable: true
                description: Only lines of this product.
            additionalProperties: true
          example:
            vendor: ff808081a0f905e201a0f9db260e01bd
            destination: '1'
            orderIds:
            - ff808081a0f905e201a0f9db263001bf
    responses:
      '200':
        description: The lines.
        content:
          application/json:
            schema:
              type: object
              required:
              - orderItems
              properties:
                orderItems:
                  type: array
                  items:
                    type: object
                    required:
                    - orderId
                    - orderItemId
                    - quantityAvailable
                    properties:
                      orderId:
                        type: string
                      orderItemId:
                        type: string
                      orderNumber:
                        type: string
                        nullable: true
                      quantityAvailable:
                        type: number
                        description: Left to ship.
                      uom:
                        type: string
                        nullable: true
                    additionalProperties: true
              additionalProperties: true
            example:
              orderItems:
              - orderId: ff808081a0f905e201a0f9db263001bf
                orderItemId: ff808081a0f905e201a0f9db263001c1
                orderNumber: PO-1042
                productCode: '10023'
                productName: Paracetamol 500mg tablets
                displayName: null
                budgetCode: null
                recipient: null
                quantityAvailable: 10
                quantityToShip: ''
                uom: EA/1
                supplierCode: SUP-10023
                productSupplierName: null
                color: null
      '401':
