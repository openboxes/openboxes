/api/dashboard/config:
  post:
    operationId: dashboardApi_updateConfig
    summary: Save my dashboard layout
    description: |
      Saves the current user's own layout of the dashboard (sub-dashboards and the order of their widgets) and answers
      it. The user sees it from then on instead of the configured one.
    tags:
    - Dashboard
    x-doc-status: complete
    x-openboxes-controller: dashboardApi
    x-openboxes-action: updateConfig
    x-openboxes-source: explicit
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/dashboard.yaml#/DashboardLayout
          example:
            personal:
              name: My Dashboard
              widgets:
              - widgetId: inventoryByLotAndBin
                order: 1
              - widgetId: inventorySummary
                order: 1
            fillRate:
              name: Fill Rate
              filters:
                category:
                  endpoint: /api/categories
              widgets:
              - widgetId: fillRateSnapshot
                order: 1
              - widgetId: fillRate
                order: 1
    responses:
      '200':
        description: The saved layout.
        content:
          application/json:
            schema:
              $ref: ../components/dashboard.yaml#/DashboardLayout
            example:
              personal:
                name: My Dashboard
                widgets:
                - widgetId: inventoryByLotAndBin
                  order: 1
                - widgetId: inventorySummary
                  order: 1
              fillRate:
                name: Fill Rate
                filters:
                  category:
                    endpoint: /api/categories
                widgets:
                - widgetId: fillRateSnapshot
                  order: 1
                - widgetId: fillRate
                  order: 1
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      default:
        $ref: ../components/responses.yaml#/Error
