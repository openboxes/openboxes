/api/facilities/{facilityId}/cycle-counts/requests/batch:
  post:
    operationId: cycleCountApi_createRequests
    summary: Request counts
    description: |
      Requests a count of each given product at the facility. A product with an open request answers 400.
    tags:
    - Cycle Count
    x-doc-status: curated
    x-openboxes-controller: cycleCountApi
    x-openboxes-action: createRequests
    x-openboxes-source: explicit
    parameters:
    - name: facilityId
      in: path
      required: true
      description: The facility (location) id.
      schema:
        type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - requests
            properties:
              requests:
                type: array
                minItems: 1
                items:
                  type: object
                  required:
                  - product
                  properties:
                    product:
                      type: string
                      description: Product id.
                    blindCount:
                      type: boolean
                      description: The counter does not see the quantity on hand.
                  additionalProperties: true
            additionalProperties: true
          example:
            requests:
            - product: ff808081a0f905e201a0f90858e60073
              blindCount: false
    responses:
      '200':
        description: The new requests.
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: array
                  items:
                    $ref: ../components/inventory.yaml#/CycleCountRequest
                status:
                  type: integer
                  description: The HTTP status, repeated.
                count:
                  type: integer
                  description: Rows in this answer.
              additionalProperties: true
            example:
              data:
              - id: ff808081a0f905e201a0f9087ca70083
                facility: '1'
                product:
                  id: ff808081a0f905e201a0f90858e60073
                  productCode: '10023'
                  name: Paracetamol 500mg tablets
                  description: null
                  category:
                    id: ff808081a0f905e201a0f90857f50071
                    name: Medicines
                  unitOfMeasure: each
                  pricePerUnit: 0.05
                  dateCreated: '2026-09-12T08:15:00Z'
                  lastUpdated: '2026-09-30T10:02:11Z'
                  color: null
                  handlingIcons: []
                  lotAndExpiryControl: true
                status: CREATED
                requestType: MANUAL_REQUEST
                initialCount:
                  deadline: null
                  assignee: null
                verificationCount:
                  deadline: null
                  assignee: null
                inventoryItemsCount: 2
                blindCount: false
                dateCreated: 2026-10-01T19:54:38.000+0000
                lastUpdated: 2026-10-01T19:54:38.000+0000
              status: 200
              count: 1
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      default:
        $ref: ../components/responses.yaml#/Error
  patch:
    operationId: cycleCountApi_updateRequests
    summary: Assign requested counts
    description: |
      Sets who counts and recounts each request and by when (assignments by count index: 0 the count, 1 the
      recount).
    tags:
    - Cycle Count
    x-doc-status: curated
    x-openboxes-controller: cycleCountApi
    x-openboxes-action: updateRequests
    x-openboxes-source: explicit
    parameters:
    - name: facilityId
      in: path
      required: true
      description: The facility (location) id.
      schema:
        type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - commands
            properties:
              commands:
                type: array
                items:
                  type: object
                  properties:
                    cycleCountRequest:
                      type: string
                      description: Request id.
                    assignments:
                      type: object
                      description: 'By count index: assignee (person id) and deadline (yyyy-MM-dd).'
                      additionalProperties:
                        type: object
                        additionalProperties: true
                        properties:
                          assignee:
                            type: string
                            nullable: true
                          deadline:
                            type: string
                            nullable: true
                  additionalProperties: true
            additionalProperties: true
          example:
            commands:
            - cycleCountRequest: ff808081a0f905e201a0f9087ca70083
              assignments:
                '0':
                  assignee: '1'
                  deadline: '2030-01-15'
                '1':
                  assignee: '1'
                  deadline: '2030-01-20'
    responses:
      '200':
        description: The updated requests.
        content:
          application/json:
            schema:
              type: object
              required:
              - data
