                    handlingLabels: []
                  inventoryItem:
                    inventoryItemId: ff808081a0f905e201a0f908a1d40099
                    productId: ff808081a0f905e201a0f90858e60073
                    productName: Paracetamol 500mg tablets
                    lotNumber: LOT-2026-07
