      default:
        $ref: ../components/responses.yaml#/Error
/api/facilities/{facility}/cycle-counts/{cycleCountId}/count:
  post:
    operationId: cycleCountApi_submitCount
    summary: Submit a count
    description: |
      Submits the counted rows: without a discrepancy (or without requireRecountOnDiscrepancy) the count completes and
      its adjustments are recorded; otherwise it waits for a recount. An outdated quantity on hand with failOnOutdatedQuantity answers 409.
    tags:
    - Cycle Count
    x-doc-status: curated
    x-openboxes-controller: cycleCountApi
    x-openboxes-action: submitCount
    x-openboxes-source: explicit
    parameters:
    - name: facility
      in: path
      required: true
      description: The facility (location) id.
      schema:
        type: string
    - name: cycleCountId
      in: path
      required: true
      description: Cycle count id.
      schema:
        type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              refreshQuantityOnHand:
                type: boolean
                description: Take the current quantity on hand first.
              failOnOutdatedQuantity:
                type: boolean
                description: Answer 409 when the quantity on hand changed since the count started.
              requireRecountOnDiscrepancy:
                type: boolean
                description: A discrepancy asks for a recount instead of completing.
            additionalProperties: true
          example:
            refreshQuantityOnHand: false
            failOnOutdatedQuantity: false
            requireRecountOnDiscrepancy: true
    responses:
      '200':
        description: The count.
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  $ref: ../components/inventory.yaml#/CycleCount
                status:
                  type: integer
                  description: The HTTP status, repeated.
              additionalProperties: true
            example:
              data:
                id: ff808081a0f905e201a0f908ab2e009f
                status: COMPLETED
                requestId: ff808081a0f905e201a0f908aa89009e
                cycleCountItems:
                - id: ff808081a0f905e201a0f908ab2e00a0
