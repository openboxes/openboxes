                data:
                  type: array
                  items:
                    $ref: ../components/inventory.yaml#/CycleCountRequest
                status:
                  type: integer
                  description: The HTTP status, repeated.
                count:
                  type: integer
                  description: Rows in this answer.
              additionalProperties: true
            example:
              data:
              - id: ff808081a0f905e201a0f9087ca70083
                facility: '1'
                product:
                  id: ff808081a0f905e201a0f90858e60073
                  productCode: '10023'
                  name: Paracetamol 500mg tablets
                  description: null
                  category:
                    id: ff808081a0f905e201a0f90857f50071
                    name: Medicines
                  unitOfMeasure: each
                  pricePerUnit: 0.05
                  dateCreated: '2026-09-12T08:15:00Z'
                  lastUpdated: '2026-09-30T10:02:11Z'
                  color: null
                  handlingIcons: []
                  lotAndExpiryControl: true
                status: CREATED
                requestType: MANUAL_REQUEST
                initialCount:
                  deadline: '2030-01-15'
                  assignee:
                    id: '1'
                    name: Jane Smith
                verificationCount:
                  deadline: null
                  assignee: null
                inventoryItemsCount: 2
                blindCount: false
                dateCreated: 2026-10-01T19:54:38.000+0000
                lastUpdated: 2026-10-01T19:54:38.000+0000
              status: 200
              count: 1
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      default:
        $ref: ../components/responses.yaml#/Error
  delete:
    operationId: cycleCountApi_deleteRequests
    summary: Cancel requested counts
    description: |
      Deletes the given count requests (and counts started from them).
    tags:
    - Cycle Count
    x-doc-status: curated
    x-openboxes-controller: cycleCountApi
    x-openboxes-action: deleteRequests
    x-openboxes-source: explicit
    parameters:
    - name: facilityId
      in: path
      required: true
      description: The facility (location) id.
      schema:
        type: string
    - name: id
      in: query
      description: Request ids (repeat for several).
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
      required: true
    responses:
      '204':
        description: Deleted.
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      default:
        $ref: ../components/responses.yaml#/Error
