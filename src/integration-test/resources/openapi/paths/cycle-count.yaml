    operationId: cycleCountApi_startCycleCount
    summary: Start counts
    description: |
      Starts the count of each given request: one row per lot and bin of the product that holds stock. Starting a
      started count answers the same count; a product without stock answers 409. format=xls or pdf answers the count sheets instead.
    tags:
    - Cycle Count
    x-doc-status: curated
    x-openboxes-controller: cycleCountApi
    x-openboxes-action: startCycleCount
    x-openboxes-source: explicit
    parameters:
    - name: facility
      in: path
      required: true
      description: The facility (location) id.
      schema:
        type: string
    - name: format
      in: query
      description: xls or pdf for the count sheet instead of JSON.
      schema:
        type: string
        enum:
        - xls
        - pdf
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - requests
            properties:
              requests:
                type: array
                minItems: 1
                items:
                  type: object
                  required:
                  - cycleCountRequest
                  properties:
                    cycleCountRequest:
                      type: string
                      description: Request id.
                    countIndex:
                      type: integer
                      description: 'Which count (recounts: 1).'
                  additionalProperties: true
            additionalProperties: true
          example:
            requests:
            - cycleCountRequest: ff808081a0f905e201a0f9087ca70083
    responses:
      '200':
        description: The counts (or the sheets).
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: array
                  items:
                    $ref: ../components/inventory.yaml#/CycleCount
                status:
                  type: integer
                  description: The HTTP status, repeated.
                count:
                  type: integer
                  description: Rows in this answer.
              additionalProperties: true
            example:
              data:
              - id: ff808081a0f905e201a0f908ab2e009f
                status: REQUESTED
                requestId: ff808081a0f905e201a0f908aa89009e
                cycleCountItems:
                - id: ff808081a0f905e201a0f908ab2e00a0
                  facility:
                    id: '1'
                    name: Main Warehouse
                    description: null
                    locationNumber: null
                    active: true
                    locationType: '2'
                    organization: '1'
                    manager: '1'
                    inventory: '1'
                    parentLocation: null
                    supportedActivities: []
                  binLocation:
                    id: ff808081a0f8481c01a0f84926570048
                    name: A-01-01
                  product:
                    id: ff808081a0f905e201a0f90858e60073
                    productCode: '10023'
                    name: Paracetamol 500mg tablets
                    handlingLabels: []
                  inventoryItem:
                    inventoryItemId: ff808081a0f905e201a0f908a1d40099
                    productId: ff808081a0f905e201a0f90858e60073
                    productName: Paracetamol 500mg tablets
                    lotNumber: LOT-2026-07
                    expirationDate: 07/31/2028
                    quantityOnHand: 0
                    quantityATP: 0
                    expires: greaterThan365Days
                    lotStatus: null
                  countIndex: 0
                  status: READY_TO_COUNT
                  quantityOnHand: 100
                  quantityCounted: null
                  quantityVariance: null
                  discrepancyReasonCode: null
                  comment: null
                  custom: false
                  dateCounted: null
                  dateCreated: 2026-10-01T19:54:50.000+0000
                  assignee: null
                initialCount:
                  assignee: null
