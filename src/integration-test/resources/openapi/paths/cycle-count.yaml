/api/cycleCounts:
  get:
    operationId: cycleCountApi_list_get
    summary: Read cycle counts
    description: |
      The given counts with their rows; format=xls or pdf answers the count (or, while recounting, recount)
      sheets instead.
    tags:
    - Cycle Count
    x-doc-status: curated
    x-openboxes-controller: cycleCountApi
    x-openboxes-action: list
    x-openboxes-source: dynamic
    parameters:
    - name: id
      in: query
      description: Cycle count ids (repeat for several).
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
    - name: sortBy
      in: query
      description: 'Order of the rows: by bin, product, ...'
      schema:
        type: string
    - name: format
      in: query
      description: xls or pdf for the count sheet instead of JSON.
      schema:
        type: string
        enum:
        - xls
        - pdf
    responses:
      '200':
        description: The counts (or the sheets).
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: array
                  items:
                    $ref: ../components/inventory.yaml#/CycleCount
                status:
                  type: integer
                  description: The HTTP status, repeated.
                count:
                  type: integer
                  description: Rows in this answer.
              additionalProperties: true
