# Generated by the apiDocsGenerate task from the route inventory.
# Entries with x-doc-status: stub are regenerated; change x-doc-status to curated (or complete)
# before editing an entry by hand, and the generator will leave it alone.
/api/stockAdjustments:
  post:
    operationId: stockAdjustmentApi_create
    summary: Adjust stock to new quantities
    description: |
      Sets the quantity on hand of lots at the current location, as the pick page's adjust-inventory dialog does.
      The body is a JSON array of lines. Each line names a lot by `inventoryItem.id`, or by `productId`, `lotNumber`
      and `expirationDate` (MM/dd/yyyy; the lot is created when it does not exist yet), an optional `binLocation.id`,
      `quantityAdjusted` (the new quantity on hand, not the difference), `comments` (required) and an optional
      `reasonCode` (OTHER when left out). Each line records an adjustment of the difference. `location.id`, when
      given, must be the current location. Any invalid line answers 400 and no line is adjusted.
    tags:
    - Stock Adjustment
    x-doc-status: complete
    x-openboxes-controller: stockAdjustmentApi
    x-openboxes-action: create
    x-openboxes-source: dynamic
    parameters:
    - name: location.id
      in: query
      required: false
      description: The location to adjust; must be the current location.
      schema:
        type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              required:
              - quantityAdjusted
              - comments
              properties:
                inventoryItem:
                  type: object
                  description: The lot, by id. Leave out to name the lot by productId, lotNumber and expirationDate.
                  properties:
                    id:
                      type: string
                  additionalProperties: true
                productId:
                  type: string
                  description: The product, when inventoryItem is not given.
                lotNumber:
                  type: string
                  nullable: true
                  description: The lot number, when inventoryItem is not given (none for the default lot).
                expirationDate:
                  type: string
                  nullable: true
                  description: The lot's expiry as MM/dd/yyyy, when inventoryItem is not given.
                binLocation:
                  type: object
                  description: A bin of the current location, by id; an empty id or none for no bin.
                  properties:
                    id:
                      type: string
                  additionalProperties: true
                quantityAdjusted:
                  type: integer
                  minimum: 0
                  description: The new quantity on hand of the lot in the bin.
                comments:
                  type: string
                  description: Why (required).
                reasonCode:
                  type: string
                  description: A reason code name (see GET /api/reasonCodes?activityCode=ADJUST_INVENTORY); OTHER when left out.
              additionalProperties: true
    responses:
      '200':
        description: The lines as adjusted.
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: array
                  items:
                    type: object
                    required:
                    - inventoryItem.id
                    - product.id
                    - quantityAdjusted
                    - reasonCode
                    properties:
                      inventoryItem.id:
                        type: string
                      inventoryItem.lotNumber:
                        type: string
                        nullable: true
                      inventoryItem.expirationDate:
                        type: string
                        nullable: true
                      product.id:
                        type: string
                      product.productCode:
                        type: string
                      product.name:
                        type: string
                      binLocation.id:
                        type: string
                        nullable: true
                      binLocation.name:
                        type: string
                        nullable: true
                      quantityAvailable:
                        type: integer
                        description: The quantity on hand before the adjustment.
                      quantityAdjusted:
                        type: integer
                        description: The new quantity on hand.
                      dateAdjusted:
                        type: string
                        nullable: true
                      adjustedBy:
                        type: object
                        nullable: true
                        description: The person (as in GET /api/persons).
                        additionalProperties: true
                      reasonCode:
                        type: string
                      comments:
                        type: string
                        nullable: true
                    additionalProperties: true
              additionalProperties: true
            example:
              data:
              - inventoryItem.id: ff808081a0fa905c01a0fa96f0f0066c
                inventoryItem.lotNumber: LOT-2026-07
                inventoryItem.expirationDate: 07/31/2028
                product.id: ff808081a0f905e201a0f90858e60073
                product.productCode: '10023'
                product.name: Paracetamol 500mg tablets
                binLocation.id: null
                binLocation.name: null
                quantityAvailable: 10
                quantityAdjusted: 8
                dateAdjusted: null
                adjustedBy: null
                reasonCode: OTHER
                comments: Recounted
      '400':
        description: A line is invalid (nothing is adjusted), the body is not an array of lines, no location is chosen, or location.id is another location.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              errorCode: 400
              errorMessage: 'Validation error: Quantity must be greater than 0 and not equal to current quantity'
              errorMessages:
              - Quantity must be greater than 0 and not equal to current quantity
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        description: No location with the location.id given.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              errorCode: 404
              errorMessage: Location with identifier 8a8a8a8a9b9b9b9b0000000000000001 not found
      default:
        $ref: ../components/responses.yaml#/Error
