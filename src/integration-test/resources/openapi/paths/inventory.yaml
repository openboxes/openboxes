/api/facilities/{facilityId}/inventories/import:
  post:
    operationId: inventoryApi_importCsv
    summary: Import stock from a CSV
    description: |
      Raises the quantity on hand at the facility to the quantities in a CSV sent as the request body (content
      type text/csv), in the columns of the inventory import template: Product code, Product, Lot number,
      Expiration date, Bin location, Quantity (headers in any case, with spaces, dashes or underscores, or in
      camelCase such as productCode). Every row is validated first: any invalid row (unknown product or
      bin location, bad expiration date, missing, negative or non-numeric quantity) refuses the whole file with
      400. Rows whose quantity is not above the lot's current quantity on hand at the facility are then skipped.
      The remaining rows are a snapshot of their products: other lots and bins of those products at the facility
      that are not among them are set to zero.
    tags:
    - Inventory
    x-doc-status: curated
    x-openboxes-controller: inventoryApi
    x-openboxes-action: importCsv
    x-openboxes-source: unbounded
    parameters:
    - name: facilityId
      in: path
      required: true
      description: Facility (location) id.
      schema:
        type: string
    requestBody:
      required: true
      content:
        text/csv:
          schema:
            type: string
          example: |
            Product code,Product,Lot number,Expiration date,Bin location,Quantity
            10001,Paracetamol 500mg tablet,LOT-1,2031-01-31,,25
    responses:
      '200':
        description: Imported; no response body.
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '404':
        $ref: ../components/responses.yaml#/NotFound
      default:
        $ref: ../components/responses.yaml#/Error
/api/facilities/{facilityId}/inventories/reorderReport:
  get:
    operationId: inventoryApi_getReorderReport
    summary: Reorder report
    description: |
      The products of the current location (the session's; the facility in the path is not used), with the stock of
      the additional locations (which must manage inventory) added, against their inventory levels and how much to
      order up to the max quantity, filtered by inventory level status, categories and tags; expired stock is
      subtracted unless expiration says otherwise. format=csv downloads it (with the preferred vendor).
    tags:
    - Inventory
    x-doc-status: complete
    x-openboxes-controller: inventoryApi
    x-openboxes-action: getReorderReport
    x-openboxes-source: explicit
    parameters:
    - name: facilityId
      in: path
      required: true
      description: 'Not used: the report is for the current location.'
      schema:
        type: string
    - name: inventoryLevelStatus
      in: query
      description: |-
        Which products, by the status of their inventory level (default
        ALL_PRODUCTS; BELOW_MAXIMUM also lists those below their reorder level or minimum). Other
        statuses answer 400.
      schema:
        type: string
        enum:
        - ALL_PRODUCTS
        - BELOW_MAXIMUM
        - BELOW_REORDER
        - BELOW_MINIMUM
    - name: expiration
      in: query
      description: How expired stock counts (default SUBTRACT_EXPIRED_STOCK).
      schema:
        type: string
        enum:
        - SUBTRACT_EXPIRED_STOCK
        - DO_NOT_SUBTRACT_EXPIRED_STOCK
        - SUBTRACT_EXPIRING_WITHIN_MONTH
        - SUBTRACT_EXPIRING_WITHIN_QUARTER
        - SUBTRACT_EXPIRING_WITHIN_HALF_YEAR
        - SUBTRACT_EXPIRING_WITHIN_YEAR
    - name: additionalLocations
      in: query
      description: More locations whose stock counts too (ids).
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
    - name: categories
      in: query
      description: Category ids.
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
    - name: tags
      in: query
      description: Tag ids.
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
    - name: format
      in: query
      description: csv for the download.
      schema:
        type: string
        enum:
        - csv
    responses:
      '200':
        description: The report (or the CSV).
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: array
                  items:
                    $ref: ../components/inventory.yaml#/ReorderReportRow
              additionalProperties: true
            example:
              data:
              - product:
                  id: ff808081a0f905e201a0f90858e60073
                  productCode: '10023'
                  name: Paracetamol 500mg tablets
                  category: Medicines
                  unitOfMeasure: each
                  pricePerUnit: 0.05
                inventoryLevel:
                  id: ff808081a0f905e201a0f90a9a9301d2
                  product:
                    id: ff808081a0f905e201a0f90858e60073
                  inventory:
                    id: '1'
                  status:
                    enumType: org.pih.warehouse.inventory.InventoryStatus
                    name: SUPPORTED
                  minQuantity: 50
                  reorderQuantity: 100
                  maxQuantity: 200
                  forecastQuantity: null
                  forecastPeriodDays: 30.0
                  expectedLeadTimeDays: null
                  replenishmentPeriodDays: null
                  demandTimePeriodDays: null
                  abcClass: A
                  preferred: false
                  comments: null
                  binLocation: null
                  preferredBinLocation:
                    id: ff808081a0f8481c01a0f84926570048
                  replenishmentLocation: null
                  internalLocation: null
                  dateCreated: '2026-10-01T19:56:56Z'
                  lastUpdated: '2026-10-01T19:56:56Z'
                inventoryStatus: BELOW_MINIMUM
                monthlyDemand: 40
                expiredQuantityAvailableToPromise: 0
                finalQuantityAvailableToPromise: 30
                quantityToOrder: 170
                unitCost: 0.05
                expectedReorderCost: 8.5
                tags: []
          text/csv:
            schema:
              type: string
            example: |
              "Status","Code","Product","Category","Tags","Unit of measure","Vendor","Vendor code","Min quantity","Reorder quantity","Max quantity","Average Monthly Demand","Quantity Available","Quantity expired","Final quantity available","Quantity to Order","Unit cost","Expected Reorder Cost"
              "Low stock","10023","Paracetamol 500mg tablets","Medicines","","each","Acme Pharma","AP-10023","50","100","200","40","30","0","30","170","0.05","8.50"
      '400':
        description: |-
          A filter cannot be read or is not one the report supports, or an additional
          location does not manage inventory.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              errorCode: 400
              errorMessage: 'Validation error: inventoryLevelStatus could not be read: ''NOT_A_STATUS'' is not one of IN_STOCK, OUT_OF_STOCK, NEVER_IN_STOCK, BELOW_MINIMUM, BELOW_REORDER, BELOW_MAXIMUM, ABOVE_MAXIMUM, ALL_PRODUCTS'
              errorMessages:
              - 'inventoryLevelStatus could not be read: ''NOT_A_STATUS'' is not one of IN_STOCK, OUT_OF_STOCK, NEVER_IN_STOCK, BELOW_MINIMUM, BELOW_REORDER, BELOW_MAXIMUM, ABOVE_MAXIMUM, ALL_PRODUCTS'
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      default:
        $ref: ../components/responses.yaml#/Error
/api/inventories/expirationHistoryReport:
  get:
    operationId: inventoryApi_getExpirationHistoryReport
    summary: Expiration history report
    description: |
      Stock written off as expired at the current location between two dates (the end date's whole day included),
      newest first, with the quantity and value lost; the totals cover every match, not only the page shown.
      format=csv downloads the matches (every one when the paging parameters are left out, as the report page does).
    tags:
    - Inventory
    x-doc-status: complete
    x-openboxes-controller: inventoryApi
    x-openboxes-action: getExpirationHistoryReport
    x-openboxes-source: explicit
    parameters:
    - name: startDate
      in: query
      description: First day, MM/DD/YYYY.
      schema:
        type: string
      required: true
    - name: endDate
      in: query
      description: Last day, MM/DD/YYYY (included).
      schema:
        type: string
      required: true
    - name: searchTerm
      in: query
      description: The transaction number, the product code or the transaction id contains this (not the product name).
      schema:
        type: string
    - name: paginationParams.max
      in: query
      description: Page size.
      schema:
        type: integer
    - name: paginationParams.offset
      in: query
      description: Rows to skip.
      schema:
        type: integer
    - name: format
      in: query
      description: csv for the download.
      schema:
        type: string
        enum:
        - csv
    responses:
      '200':
        description: The rows and totals (or the CSV).
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: array
                  items:
                    type: object
                    required:
                    - transactionId
                    - transactionDate
                    - productId
                    - productCode
                    - productName
                    - quantityLostToExpiry
                    properties:
                      transactionId:
                        type: string
                      transactionNumber:
                        type: string
                        nullable: true
                      transactionDate:
                        type: string
                        format: date-time
                      productId:
                        type: string
                      productCode:
                        type: string
                      productName:
                        type: string
                      category:
                        type: object
                        nullable: true
                        additionalProperties: true
                      lotNumber:
                        type: string
                        nullable: true
                      expirationDate:
                        type: string
                        format: date-time
                        nullable: true
                      quantityLostToExpiry:
                        type: integer
                      unitPrice:
                        type: number
                        nullable: true
                      valueLostToExpiry:
                        type: number
                        nullable: true
                    additionalProperties: true
                totalCount:
                  type: integer
                totalQuantityLostToExpiry:
                  type: number
                totalValueLostToExpiry:
                  type: number
              additionalProperties: true
            example:
              data:
              - transactionId: ff808081a0fa905c01a0fa90faef0004
                transactionNumber: null
                transactionDate: '2026-10-01T15:02:20Z'
                productId: ff808081a0f905e201a0f90858e60073
                productCode: '10023'
                productName: Paracetamol 500mg tablets
                category:
                  id: ff808081a0fa905c01a0fa90f83f0000
                  name: Medicines
                  parentCategory: null
                lotNumber: LOT-2026-01
                expirationDate: '2026-09-30T00:00:00Z'
                quantityLostToExpiry: 5
                unitPrice: 2.5
                valueLostToExpiry: 12.5
              totalCount: 1
              totalQuantityLostToExpiry: 5
              totalValueLostToExpiry: 12.5
          text/csv:
            schema:
              type: string
            example: |
              "Transaction Number","Transaction Date","Code","Product name","Category","Lot number","Expiration date","Quantity Lost to Expiry","Unit Price","Value Lost to Expiry"
              "null","2026-10-01 15:02:20.0","10023","Paracetamol 500mg tablets","Medicines","LOT-2026-01","2026-09-30 00:00:00.0","5","2.5000","12.5000"
      '400':
        description: A date is missing or not MM/DD/YYYY, the range ends before it starts, or no location is chosen.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              errorCode: 400
              errorMessage: 'Validation error: Property [endDate] is required'
              errorMessages:
              - Property [endDate] is required
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      default:
        $ref: ../components/responses.yaml#/Error
