          schema:
            type: object
            required:
            - name
            properties:
              name:
                type: string
              description:
                type: string
                nullable: true
              code:
                type: string
                description: Generated from the name when left out.
            additionalProperties: true
          example:
            name: Riverside Medical Supplies
    responses:
