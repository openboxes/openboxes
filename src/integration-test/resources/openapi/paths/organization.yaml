  post:
    operationId: organizationApi_create
    summary: Create an organization
    description: |
      Creates an organization. Its code is generated from the name, and it gets the default party type.
      Its number sequences (`sequences`) cannot be set here: they are ignored, and changed only on the organization page.
    tags:
    - Organization
    x-doc-status: complete
    x-openboxes-controller: organizationApi
    x-openboxes-action: create
    x-openboxes-source: dynamic
