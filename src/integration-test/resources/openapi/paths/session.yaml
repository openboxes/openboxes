/api/getAppContext:
  get:
    operationId: api_getAppContext
    summary: Get the app context (user, location, settings)
    description: |
      Everything a client needs after logging in: the user and their roles at the current location, the current
      location, the language, the supported languages, display and paging settings, and build information.
      The React app calls this on every page load.
    tags:
    - Session
    x-doc-status: complete
    x-openboxes-controller: api
    x-openboxes-action: getAppContext
    x-openboxes-source: unbounded
    responses:
      '200':
        description: The app context.
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  required:
                  - user
                  - location
                  - isSuperuser
                  - isUserAdmin
                  - isUserManager
                  - supportedActivities
                  - activeLanguage
                  - supportedLocales
                  - menuItems
                  - pageSize
                  - isPaginated
                  - currencyCode
                  properties:
                    user:
                      type: object
                      required:
                      - id
                      - username
                      properties:
                        id:
                          type: string
                        username:
                          type: string
                        name:
                          type: string
                        email:
                          type: string
                          nullable: true
                      additionalProperties: true
                    location:
                      type: object
                      nullable: true
                      description: The current location (a Location), or null right after a login without a location.
                      required:
                      - id
                      - name
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        locationType:
                          type: object
                          additionalProperties: true
                        supportedActivities:
                          type: array
                          items:
                            type: string
                      additionalProperties: true
                    highestRole:
                      type: string
                      nullable: true
                      description: The user's highest role at the current location.
                    currentLocationRoles:
                      type: array
                      nullable: true
                      items:
                        type: string
                    isSuperuser:
                      type: boolean
                    isUserAdmin:
                      type: boolean
                    isUserManager:
                      type: boolean
                    isUserApprover:
                      type: boolean
                    isUserRequestApprover:
                      type: boolean
                    isImpersonated:
                      type: boolean
                    supportedActivities:
                      type: array
                      description: What the current location supports (ActivityCode names); empty without a location.
                      items:
                        type: string
                    activeLanguage:
                      type: string
                    activeLanguageTag:
                      type: string
                    supportedLocales:
                      type: array
                      items:
                        type: object
                        required:
                        - code
                        - name
                        properties:
                          code:
                            type: string
                          name:
                            type: string
                        additionalProperties: true
                    menuItems:
                      type: array
                      description: The user menu (profile, translation mode, caches, logout).
                      items:
                        type: object
                        required:
                        - label
                        - linkAction
                        properties:
                          label:
                            type: string
                          linkAction:
                            type: string
                          linkIcon:
                            type: string
                          linkReactIcon:
                            type: string
                        additionalProperties: true
                    pageSize:
                      type: integer
                    isPaginated:
                      type: boolean
                    currencyCode:
                      type: string
                    appVersion:
                      type: string
                      nullable: true
                    buildNumber:
                      type: string
                      nullable: true
                      description: Short commit id; null when the build has no git information.
                    branchName:
                      type: string
                      nullable: true
                    environment:
                      type: string
                    timezone:
                      type: string
                      nullable: true
                    logoUrl:
                      type: string
                      nullable: true
                    maxUploadFileSize:
                      type: integer
                  additionalProperties: true
              additionalProperties: true
            example:
              data:
                user:
                  id: '1'
                  username: jsmith
                  name: Jane Smith
                  email: jsmith@example.org
                location:
                  id: '1'
                  name: Main Warehouse
                  active: true
                  supportedActivities:
                  - MANAGE_INVENTORY
                  locationType:
                    id: '2'
                    name: Depot
                    locationTypeCode: DEPOT
                highestRole: Manager
                isSuperuser: false
                isUserAdmin: false
                isUserManager: true
                supportedActivities:
                - MANAGE_INVENTORY
                - PLACE_ORDER
                activeLanguage: en
                activeLanguageTag: en
                supportedLocales:
                - code: en
                  name: English
                - code: fr
                  name: French
                menuItems:
                - label: Logout
                  linkAction: /openboxes/auth/logout
                  linkReactIcon: logout
                pageSize: 10
                isPaginated: true
                currencyCode: USD
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      default:
        $ref: ../components/responses.yaml#/Error
