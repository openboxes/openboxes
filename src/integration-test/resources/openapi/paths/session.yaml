/api/status:
  get:
    operationId: api_status
    summary: Check that the application is up
    description: |
      Answers without a login. 200 when the application and its database answer; 503 (in the error shape) when
      the database does not - so a monitor or load balancer can go by the status code.
    tags:
    - Session
    x-doc-status: complete
    x-openboxes-controller: api
    x-openboxes-action: status
    x-openboxes-source: unbounded
    security: []
    responses:
      '200':
        description: The application and its database answer.
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              - database
              properties:
                status:
                  type: string
                  enum:
                  - OK
                database:
                  type: object
                  required:
                  - status
                  - message
                  properties:
                    status:
                      type: boolean
                    message:
                      type: string
                  additionalProperties: true
              additionalProperties: true
            example:
              status: OK
              database:
                status: true
                message: Database is available
      '503':
        description: The database does not answer; errorMessage says why.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              errorCode: 503
              errorMessage: Database is not available
      default:
        $ref: ../components/responses.yaml#/Error
