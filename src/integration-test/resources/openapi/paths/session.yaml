/api/login:
  post:
    operationId: api_login
    summary: Log in
    description: |
      Starts a session for the user. The response sets the `JSESSIONID` cookie that authenticates
      every later call. Pass `location` to pick the current location in the same call, or pick one
      later with `PUT /api/chooseLocation/{id}`.
    tags:
    - Session
    x-doc-status: complete
    x-openboxes-controller: api
    x-openboxes-action: login
    x-openboxes-source: unbounded
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - username
            - password
            properties:
              username:
                type: string
                description: Username or email address.
              password:
                type: string
                format: password
              location:
                type: string
                description: Id of the location to log into (optional).
          example:
            username: jsmith
            password: your-password
    responses:
      '200':
        description: Logged in; the response sets the session cookie.
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  required:
                  - message
                  - username
                  properties:
                    message:
                      type: string
                    username:
                      type: string
                    location:
                      type: string
                      nullable: true
                      description: The location logged into, when one was given.
                  additionalProperties: true
              additionalProperties: true
            example:
              data:
                message: Authentication was successful
                username: jsmith
                location: null
      '401':
        description: Wrong username or password.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              errorCode: 401
              errorMessage: Authentication failed
