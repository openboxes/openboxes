/api/chooseLocale/{id}:
  put:
    operationId: api_chooseLocale
    summary: Choose the session's language
    description: |
      Sets the language of the session: labels, messages and option lists come back in it. The code must be one of
      the app context's `supportedLocales` (e.g. `fr`, `es_MX`).
    tags:
    - Session
    x-doc-status: complete
    x-openboxes-controller: api
    x-openboxes-action: chooseLocale
    x-openboxes-source: unbounded
    parameters:
    - name: id
      in: path
      required: true
      description: Locale code (language, or language_COUNTRY).
      schema:
        type: string
      example: fr
    responses:
      '200':
        description: The session's language changed.
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  required:
                  - activeLanguage
                  - activeLanguageTag
                  properties:
                    activeLanguage:
                      type: string
                      description: Locale code, e.g. es_MX.
                    activeLanguageTag:
                      type: string
                      description: BCP 47 tag, e.g. es-MX.
                  additionalProperties: true
              additionalProperties: true
            example:
              data:
                activeLanguage: fr
                activeLanguageTag: fr
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        description: The application does not support this language.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              errorCode: 404
              errorMessage: Locale with identifier xx not found
      default:
        $ref: ../components/responses.yaml#/Error
