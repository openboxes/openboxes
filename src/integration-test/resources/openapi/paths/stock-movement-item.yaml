    x-openboxes-controller: stockMovementItemApi
    x-openboxes-action: updatePicklist
    x-openboxes-source: explicit
    parameters:
    - name: id
      in: path
      required: true
      description: Stock movement item (requisition item) id.
      schema:
        type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - picklistItems
            properties:
              picklistItems:
                type: array
                items:
                  type: object
                  properties:
                    inventoryItem:
                      $ref: ../components/catalog.yaml#/RefInput
                    binLocation:
                      $ref: ../components/stock-movement.yaml#/IdOrEmpty
                    quantityPicked:
                      type: integer
                  additionalProperties: true
              reasonCode:
                type: string
            additionalProperties: true
          example:
