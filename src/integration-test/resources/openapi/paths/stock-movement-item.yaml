/api/stockMovementItems:
  get:
    operationId: stockMovementItemApi_list
    summary: List the items of a stock movement
    description: The line items of the stock movement given as stockMovement.id (required; 404 when it does not exist).
    tags:
    - Stock Movement Item
    x-doc-status: complete
    x-openboxes-controller: stockMovementItemApi
    x-openboxes-action: list
    x-openboxes-source: explicit
    parameters:
    - name: stockMovement.id
      in: query
      required: true
      description: Stock movement id.
      schema:
        type: string
    responses:
      '200':
        description: The items.
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: array
                  items:
                    $ref: ../components/stock-movement.yaml#/StockMovementItem
              additionalProperties: true
            example:
              data:
              - id: ff808081a0f4c1bc01a0f4c8de7c003c
                productCode: '10001'
                product:
                  id: ff808081a0f4c1bc01a0f4c8d6530030
                  productCode: '10001'
                  name: Paracetamol 500mg
                  active: true
                  handlingIcons: []
                  lotAndExpiryControl: true
                lotNumber: ''
                expirationDate: null
                statusCode: APPROVED
                quantityRequested: 5
                quantityPicked: 0
                sortOrder: 100
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      default:
        $ref: ../components/responses.yaml#/Error
