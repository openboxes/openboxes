/api/stocklists:
  get:
    operationId: stocklistApi_list
    summary: List stock lists
    description: |
      Stock lists (requisition templates), published ones unless isPublished=false (drafts too with
      includeUnpublished=true), optionally by origin and destination, newest first unless sorted otherwise, paged.
      format=csv downloads one row per product with a quantity column per stock list (cost columns for users with the
      finance role).
    tags:
    - Stocklist
    x-doc-status: complete
    x-openboxes-controller: stocklistApi
    x-openboxes-action: list
    x-openboxes-source: dynamic
    parameters:
    - name: origin
      in: query
      description: Only stock lists with these origins.
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
    - name: destination
      in: query
      description: Only stock lists with these destinations.
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
    - name: isPublished
      in: query
      description: Published (default true) or draft stock lists; ignored when includeUnpublished is true.
      schema:
        type: boolean
    - name: includeUnpublished
      in: query
      description: Both published and draft stock lists (what the stock list page sends).
      schema:
        type: boolean
    - name: q
      in: query
      description: Only stock lists whose name or request number contains this text.
      schema:
        type: string
    - name: sort
      in: query
      description: Property to sort by.
      schema:
        type: string
    - name: order
      in: query
      description: Sort direction.
      schema:
        type: string
        enum:
        - asc
        - desc
    - name: max
      in: query
      description: Page size (default 10).
      schema:
        type: integer
        minimum: 0
    - name: offset
      in: query
      description: Index of the first stock list.
      schema:
        type: integer
        minimum: 0
    - name: format
      in: query
      description: csv for the download.
      schema:
        type: string
        enum:
        - csv
    responses:
      '200':
        description: The stock lists (or the CSV).
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: array
                  items:
                    $ref: ../components/stocklist.yaml#/StocklistSummary
                totalCount:
                  type: integer
                  description: All matching stock lists.
              additionalProperties: true
            example:
              data:
              - id: ff808081a0f905e201a0f90b4346024b
                name: Ward 3 weekly
                origin: Main Warehouse
                destination: Ward 3
                requisitionItemCount: 12
                requestedBy: Jane Smith
                createdBy: Jane Smith
                updatedBy: Jane Smith
                dateCreated: Oct 01, 2026
                lastUpdated: Oct 01, 2026
                isPublished: true
              totalCount: 1
          text/csv:
            schema:
              type: string
            example: |
              Product Code,Product description,Category,Ward 3 weekly,Unit cost,Total value
              10023,Paracetamol 500mg tablets,Medicines,200,0.05,10.00
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      default:
        $ref: ../components/responses.yaml#/Error
  post:
    operationId: stocklistApi_create
    summary: Create a stock list
    description: |
      Creates a draft stock list for a destination, filled from its origin.
    tags:
    - Stocklist
    x-doc-status: complete
    x-openboxes-controller: stocklistApi
    x-openboxes-action: create
    x-openboxes-source: dynamic
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/stocklist.yaml#/StocklistCreate
          example:
            name: Ward 3 weekly
            origin:
              id: '1'
            destination:
              id: ff808081a0f905e201a0f90b41ce0248
            requestedBy:
              id: '1'
    responses:
      '201':
        description: The new stock list.
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  $ref: ../components/stocklist.yaml#/Stocklist
              additionalProperties: true
            example:
              data:
                requisition.id: ff808081a0f905e201a0f90b4346024b
                name: Ward 3 weekly
                destination.id: ff808081a0f905e201a0f90b41ce0248
                destination.name: Ward 3
                origin.id: '1'
                origin.name: Main Warehouse
                requestedBy.id: '1'
                requestedBy.name: Jane Smith
      '400':
        description: A required field is missing or a reference is unknown.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              errorCode: 400
              errorMessage: 'Validation error: Property [Name] is required'
              errorMessages:
              - Property [Name] is required
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      default:
        $ref: ../components/responses.yaml#/Error
/api/stocklists/sendMail/{id}:
  post:
    operationId: stocklistApi_sendMail
    summary: Send a stock list by mail
    tags:
    - Stocklist
    x-doc-status: curated
    x-openboxes-controller: stocklistApi
    x-openboxes-action: sendMail
    x-openboxes-source: explicit
    parameters:
    - name: id
      in: path
      required: true
      description: Stock list (requisition template) id.
      schema:
        type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - recipients
            additionalProperties: true
            properties:
              subject:
                type: string
              text:
                type: string
              recipients:
                type: array
                items:
                  type: string
                  format: email
                minItems: 1
              includePdf:
                type: boolean
              includeXls:
                type: boolean
    responses:
      '200':
        description: Sent (or skipped when mail is disabled); no response body.
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '404':
        $ref: ../components/responses.yaml#/NotFound
      default:
        $ref: ../components/responses.yaml#/Error
    description: Mails the stock list to the recipients, optionally with a spreadsheet (includeXls, Excel 97-2003) and a PDF (includePdf) attached. "Sent by <user>" is added to the text. Nothing is sent when mail is disabled.
