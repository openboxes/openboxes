/api/locations/importCsv:
  post:
    operationId: locationApi_importCsv
    summary: Import locations from CSV
    description: |
      Creates or updates locations from a CSV file in the template's columns (see `GET /api/locations/template`),
      sent as the multipart field `importFile` with content type text/csv. Rows with an `id` update that location.
      The whole file is checked first; any problem answers 400 with one entry per row problem, and nothing is saved.
    tags:
    - Location
    x-doc-status: curated
    x-openboxes-controller: locationApi
    x-openboxes-action: importCsv
    x-openboxes-source: explicit
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
            - importFile
            properties:
              importFile:
                type: string
                format: binary
                description: The CSV file (content type text/csv).
            additionalProperties: true
    responses:
      '200':
        description: Imported.
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      default:
        $ref: ../components/responses.yaml#/Error
