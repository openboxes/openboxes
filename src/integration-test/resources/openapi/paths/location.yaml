                    code: ORG
                    partyTypeCode: ORGANIZATION
                  roles:
                  - id: '1'
                    roleType: ROLE_ORGANIZATION
                    startDate: null
                    endDate: null
                  sequences: {}
                manager: null
                address: null
                supportedActivities:
                - MANAGE_INVENTORY
                - RECEIVE_STOCK
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        description: No location with this id.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              errorCode: 404
              errorMessage: Location with identifier 8a8a8a8a9b9b9b9b0000000000000001 not found
      default:
        $ref: ../components/responses.yaml#/Error
  delete:
    operationId: locationApi_delete
    summary: Delete a location
    description: |
      Deletes a location. A zone that bins are assigned to, or a location other records still refer to (stock,
      orders, shipments, ...), is not deleted (409).
    tags:
    - Location
    x-doc-status: curated
    x-openboxes-controller: locationApi
    x-openboxes-action: delete
    x-openboxes-source: dynamic
    parameters:
    - name: id
      in: path
      required: true
      description: Location id.
      schema:
        type: string
    responses:
      '204':
        description: Deleted.
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        description: No location with this id.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              errorCode: 404
              errorMessage: Location with identifier 8a8a8a8a9b9b9b9b0000000000000001 not found
      '409':
        description: A zone with bins, or a location still in use; nothing is deleted.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              errorCode: 409
              errorMessage: You cannot delete zone that is assigned to a bin location 8a8a8a8a9b9b9b9b0000000000000001
      default:
        $ref: ../components/responses.yaml#/Error
/api/locations/{id}/binLocations/import:
  post:
    operationId: locationApi_importBinLocations
    summary: Import bin locations from a spreadsheet
    description: |
      Adds bin locations to the location (for a zone: to its parent) from an Excel (.xls) file in the template's
      columns (see `GET /api/locations/binLocations/template`): bin name, then an optional zone name. The first row
      is the header. Bins that already exist under the location are kept (their zone is updated); a zone must
      already exist under the location. A file that cannot be read, has no bins or names an unknown zone answers
      400 and nothing is saved; an unknown location answers 404.
    tags:
    - Location
    x-doc-status: curated
    x-openboxes-controller: locationApi
    x-openboxes-action: importBinLocations
    x-openboxes-source: explicit
    parameters:
    - name: id
      in: path
      required: true
      description: The location (or zone) to add the bins to.
      schema:
        type: string
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
            - fileContents
            properties:
              fileContents:
                type: string
                format: binary
                description: The Excel (.xls) file.
            additionalProperties: true
    responses:
      '200':
        description: Imported.
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      default:
        $ref: ../components/responses.yaml#/Error
/api/locations/{id}/productSummary:
  get:
    operationId: locationApi_productSummary
    summary: Quantity on hand per product
    description: |
      The quantity on hand of every product at the current location (the location in the path must be the current
      one).
    tags:
    - Location
    x-doc-status: complete
    x-openboxes-controller: locationApi
    x-openboxes-action: productSummary
    x-openboxes-source: unbounded
    parameters:
    - name: id
      in: path
      required: true
      description: The current location's id.
      schema:
        type: string
    responses:
      '200':
        description: One row per product.
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: array
                  items:
                    type: object
                    required:
                    - productId
                    - productCode
                    - productName
                    - quantityOnHand
                    properties:
                      productId:
                        type: string
                      productCode:
                        type: string
                      productName:
                        type: string
                      quantityOnHand:
                        type: integer
                        description: May be negative.
                    additionalProperties: true
              additionalProperties: true
            example:
              data:
              - productId: ff808081a0f905e201a0f90858e60073
                productCode: '10023'
                productName: Paracetamol 500mg tablets
                quantityOnHand: 100
      '400':
        description: The location is not the current location (or none is chosen).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              errorCode: 400
              errorMessage: The product summary is available for the current location only (PUT /api/chooseLocation/{id})
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        description: No location with this id.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              errorCode: 404
              errorMessage: Location with identifier 8a8a8a8a9b9b9b9b0000000000000001 not found
      default:
        $ref: ../components/responses.yaml#/Error
