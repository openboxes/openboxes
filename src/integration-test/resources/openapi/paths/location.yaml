/api/locations:
  get:
    operationId: locationApi_list
    summary: List locations
    description: |
      The locations the user may see (all of them for a superuser). A `name` shorter than three characters answers
      an empty list. `presentation=toBaseJson` answers a compact form (id, name, number, type, active).
      `locationChooser=true` lists the locations the user may log into. `direction=OUTBOUND` answers 400 before a current location is chosen.
    tags:
    - Location
    x-doc-status: complete
    x-openboxes-controller: locationApi
    x-openboxes-action: list
    x-openboxes-source: dynamic
    parameters:
    - name: name
      in: query
      description: Only locations whose name contains this text (at least three characters).
      schema:
        type: string
    - name: locationTypeCode
      in: query
      description: Only locations of this type code (DEPOT, WARD, SUPPLIER, ...).
      schema:
        type: string
    - name: activityCodes
      in: query
      description: Only locations that support these activities.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    - name: direction
      in: query
      description: INBOUND - suppliers (or locationTypeCode) to receive from; OUTBOUND - locations in the current location's group, and depots, to send to (needs a current location).
      schema:
        type: string
        enum:
        - INBOUND
        - OUTBOUND
    - name: applyUserFilter
      in: query
      description: Only locations where the user has a role.
      schema:
        type: boolean
    - name: withOrganization
      in: query
      description: Only locations that belong to an organization.
      schema:
        type: boolean
    - name: isReturnOrder
      in: query
      description: Only locations a return can go to (no depots that manage inventory, no suppliers).
      schema:
        type: boolean
    - name: locationChooser
      in: query
      description: Lists the locations the user may log into.
      schema:
        type: boolean
    - name: presentation
      in: query
      description: toBaseJson for the compact form.
      schema:
        type: string
        enum:
        - toBaseJson
    - name: fields
      in: query
      description: Comma-separated fields to return (e.g. id,name). Each row is then only those values (one value, or an array of values per row), not the location object described below; the web app does not use it.
      schema:
        type: string
    responses:
      '200':
        description: The locations.
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: array
                  items:
                    type: object
                    required:
                    - id
                    - name
                    description: A location (see Location); with presentation=toBaseJson only id, name, locationNumber, active, locationType and locationTypeCode.
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      locationNumber:
                        type: string
                        nullable: true
                      active:
                        type: boolean
                      locationTypeCode:
                        type: string
                      locationType:
                        type: object
                        properties:
                          id:
                            type: string
                          name:
                            type: string
                          locationTypeCode:
                            type: string
                        additionalProperties: true
                    additionalProperties: true
              additionalProperties: true
            example:
              data:
              - id: '1'
                name: Main Warehouse
                locationNumber: null
                active: true
                locationType:
                  id: '2'
                  name: Depot
                  description: Depot
                  locationTypeCode: DEPOT
                locationTypeCode: DEPOT
      '400':
        description: direction=OUTBOUND before a current location is chosen.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              errorCode: 400
              errorMessage: Choose a location first (PUT /api/chooseLocation/{id}) to list OUTBOUND locations
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      default:
        $ref: ../components/responses.yaml#/Error
  post:
    operationId: locationApi_create
    summary: Create a location
    description: |
      Creates a location (depot, ward, supplier, bin, ...) as the location configuration page and the add-destination
      dialog do. A location number and an inventory are generated. useDefaultActivities=true gives it its type's
      activities instead of its own list; assignCurrentLocationGroup=true puts it in the current location's group.
    tags:
    - Location
    x-doc-status: complete
    x-openboxes-controller: locationApi
    x-openboxes-action: upsert
    x-openboxes-source: dynamic
    parameters:
    - name: useDefaultActivities
      in: query
      description: Use the location type's activities (only the value true does).
      schema:
        type: boolean
        default: false
    - name: assignCurrentLocationGroup
      in: query
      description: Put the location in the current location's group (only true does).
      schema:
        type: boolean
        default: false
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
              description:
                type: string
                nullable: true
              active:
                type: boolean
              locationNumber:
                type: string
                nullable: true
                description: Generated when left out.
              locationType:
                description: 'The location type: an id, or an object with its id.'
                oneOf:
                - type: string
                - $ref: ../components/catalog.yaml#/RefInput
              organization:
                $ref: ../components/catalog.yaml#/OptionalRefInput
              locationGroup:
                $ref: ../components/catalog.yaml#/OptionalRefInput
              parentLocation:
                $ref: ../components/catalog.yaml#/OptionalRefInput
              zone:
                $ref: ../components/catalog.yaml#/OptionalRefInput
              manager:
                $ref: ../components/catalog.yaml#/OptionalRefInput
              sortOrder:
                type: integer
                nullable: true
              bgColor:
                type: string
                nullable: true
                description: Background color of the location's header (hex, e.g. FFFFFF).
              fgColor:
                type: string
                nullable: true
                description: Text color of the location's header (hex).
              supportedActivities:
                type: array
                items:
                  type: string
                description: ActivityCode names. An empty list means none (NONE); leave the field out to keep the current list.
              address:
                type: object
                nullable: true
                properties:
                  address:
                    type: string
                    nullable: true
                  address2:
                    type: string
                    nullable: true
                  city:
                    type: string
                    nullable: true
                  stateOrProvince:
                    type: string
                    nullable: true
                  postalCode:
                    type: string
                    nullable: true
                  country:
                    type: string
                    nullable: true
                additionalProperties: true
              logo:
                type: string
                description: The logo image, base64 encoded.
            required:
            - name
            - locationType
            additionalProperties: true
          example:
            name: North Depot
            active: true
            locationType:
              id: '2'
            organization:
              id: '1'
            supportedActivities:
            - MANAGE_INVENTORY
            - RECEIVE_STOCK
    responses:
      '200':
        description: The new location.
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  $ref: ../components/catalog.yaml#/Location
              additionalProperties: true
            example:
              data:
                id: ff808081a0fa905c01a0fa9133630125
                name: North Depot
                description: null
                locationNumber: 445ABF
                locationGroup: null
                parentLocation: null
                locationType:
                  id: '2'
                  name: Depot
                  description: Depot
                  locationTypeCode: DEPOT
                sortOrder: null
                hasBinLocationSupport: false
                hasPackingSupport: false
                hasPartialReceivingSupport: false
                hasCentralPurchasingEnabled: false
                organizationName: Main Organization
                organizationCode: MO
                backgroundColor: FFFFFF
                zoneName: null
                zoneId: null
                active: true
                organization:
                  id: '1'
                  name: Main Organization
                  displayName: MO - Main Organization
                  description: null
                  code: MO
                  dateCreated: '2020-12-26T05:00:00Z'
                  lastUpdated: '2020-12-26T05:00:00Z'
                  defaultLocation: null
                  partyType:
                    id: '1'
                    name: Organization
                    code: ORG
                    partyTypeCode: ORGANIZATION
                  roles:
                  - id: '1'
                    roleType: ROLE_ORGANIZATION
                    startDate: null
                    endDate: null
                  sequences: {}
                manager: null
                address: null
                supportedActivities:
                - MANAGE_INVENTORY
                - RECEIVE_STOCK
      '400':
        description: A required field is missing or invalid (e.g. no organization for a depot or supplier, or an inactive one).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              errorCode: 400
              errorMessage: 'Validation error: Organization is required for location types [DEPOT, SUPPLIER]; Property [Name] is required'
              errorMessages:
              - Organization is required for location types [DEPOT, SUPPLIER]
              - Property [Name] is required
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      default:
        $ref: ../components/responses.yaml#/Error
    x-obaf-note: OBAF routes this to locationApi/upsert; previously documented as locationApi/create
