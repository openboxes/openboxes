name: Frontend tests

# Is only runnable via other workflows
on:
  workflow_call:

jobs:
  run-frontend-unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: 14
          cache: npm

      - run: npm ci
      - run: npm test

      # The production bundle, which also runs ESLint (webpack.config.js). The backend tests skip building it.
      # Runs even when a test fails, so both kinds of failure show in one run.
      - run: npm run bundle
        if: ${{ !cancelled() }}
