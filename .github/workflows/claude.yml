name: Claude Code

# HOW TO TURN THIS OFF
#
#   Kill switch (no code change, takes effect immediately):
#     gh variable set CLAUDE_REVIEW_ENABLED --body false
#   Turn it back on:
#     gh variable set CLAUDE_REVIEW_ENABLED --body true   (or delete the variable)
#   The variable is opt-out: when it is unset, Claude is enabled.
#
#   Full removal: delete this file. Then also revoke the credential
#   (gh secret delete CLAUDE_CODE_OAUTH_TOKEN), uninstall the Claude GitHub App
#   from the openboxes org, and delete the "reviewer: claude" label. Deleting
#   only this file leaves the App installed and the token live.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [labeled]

jobs:
  claude:
    if: |
      vars.CLAUDE_REVIEW_ENABLED != 'false' && (
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      (github.event_name == 'pull_request' && github.event.label.name == 'reviewer: claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # For the "reviewer: claude" label there is no @claude comment to take
          # instructions from, so supply a prompt. For every other trigger this
          # resolves to an empty string and Claude follows the comment instead.
          prompt: ${{ (github.event_name == 'pull_request' && 'Review this pull request. Focus on correctness bugs, then on reuse and simplification opportunities. Leave inline comments on the specific lines involved and finish with a short summary. Do not approve or request changes; just comment.') || '' }}

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr *)'
